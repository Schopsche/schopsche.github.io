    }
    svg.addEventListener('pointerup', endDrag);
    svg.addEventListener('pointercancel', endDrag);
    svg.addEventListener('dblclick', function(e){
      var g = eventToGraphPx(e);
      var curve = lock.thicknessCurve;
      var found = findNearestPoint(g.px, g.py);
      if(found && curve.length > 2 && curve[0] !== found && curve[curve.length-1] !== found){
        pushUndoSnapshot();
        if(selectedPoint === found) selectedPoint = null;
        lock.thicknessCurve = curve.filter(function(p){ return p !== found; });
        regenerateLockGeometry(lock);
        redrawPath(); redrawPoints(); redrawHandles(); updateTypeRow();
      }
    });
    resetBtn.addEventListener('click', function(){
      pushUndoSnapshot();
      lock.thicknessCurve = defaultThicknessCurve();
      selectedPoint = null;
      regenerateLockGeometry(lock);
      redrawPath(); redrawPoints(); redrawHandles(); updateTypeRow();
    });

    field.appendChild(svg);
    field.appendChild(typeRow);
    var hint = document.createElement('div'); hint.className = 'curve-hint';
    hint.textContent = t('hint.curveEditor');
    field.appendChild(hint);
    wrap.appendChild(field);
  }

  // Editable positions (along the strand's width, -1..1) where the tip notches inward.
  // Same drag/click/double-click interaction pattern as the thickness curve editor above.
  function buildSplitCutsEditor(lock, wrap){
    var W = 260, H = 130, PAD = 14, LEN_MAX = 0.75;
    function gx(u){ return PAD + (u+1)/2*(W-2*PAD); }
    function gy(len){ return PAD + (1 - len/LEN_MAX)*(H-2*PAD); }
    function invX(px){ return Math.min(0.96, Math.max(-0.96, ((px-PAD)/(W-2*PAD))*2 - 1)); }
    function invY(py){ return Math.min(LEN_MAX, Math.max(0.02, (1-(py-PAD)/(H-2*PAD))*LEN_MAX)); }

    var field = document.createElement('div'); field.className = 'field';
    var row = document.createElement('div'); row.className = 'field-label-row';
    var label = document.createElement('span'); label.className = 'field-label'; label.textContent = t('field.splitCuts');
    row.appendChild(label);
    field.appendChild(row);

    var svgNS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('class', 'cuts-editor-svg cuts-editor-2d');

    var bg = document.createElementNS(svgNS, 'rect');
    bg.setAttribute('x', gx(-1)); bg.setAttribute('y', PAD);
    bg.setAttribute('width', gx(1)-gx(-1)); bg.setAttribute('height', H-2*PAD);
    bg.setAttribute('rx', 4);
    bg.setAttribute('class', 'cuts-bar');
    svg.appendChild(bg);

    // reference gridlines: tip (bottom edge) and a mid-length guide
    [0, LEN_MAX*0.5].forEach(function(len){
      var ln = document.createElementNS(svgNS, 'line');
      ln.setAttribute('x1', gx(-1)); ln.setAttribute('x2', gx(1));
      ln.setAttribute('y1', gy(len)); ln.setAttribute('y2', gy(len));
      ln.setAttribute('class', 'curve-grid');
      svg.appendChild(ln);
    });
    var tipLabel = document.createElementNS(svgNS, 'text');
    tipLabel.setAttribute('x', gx(-1)); tipLabel.setAttribute('y', gy(0)-3);
    tipLabel.setAttribute('class', 'cuts-axis-label');
    tipLabel.textContent = t('axis.tip');
    svg.appendChild(tipLabel);
    var rootLabel = document.createElementNS(svgNS, 'text');
    rootLabel.setAttribute('x', gx(-1)); rootLabel.setAttribute('y', PAD+9);
    rootLabel.setAttribute('class', 'cuts-axis-label');
    rootLabel.textContent = t('axis.root');
    svg.appendChild(rootLabel);

    var marksLayer = document.createElementNS(svgNS, 'g');
    svg.appendChild(marksLayer);

    function redraw(){
      while(marksLayer.firstChild) marksLayer.removeChild(marksLayer.firstChild);
      lock.splitCuts.forEach(function(cut){
        var c = document.createElementNS(svgNS, 'circle');
        c.setAttribute('cx', gx(cut.u)); c.setAttribute('cy', gy(cut.len));
        c.setAttribute('r', 7);
        c.setAttribute('class', 'cut-point');
        marksLayer.appendChild(c);
      });
    }
    redraw();

    function pxyFromEvent(e){
      var rect = svg.getBoundingClientRect();
      return {
        px: (e.clientX-rect.left) * (W/rect.width),
        py: (e.clientY-rect.top) * (H/rect.height)
      };
    }
    function findNearestIndex(px, py){
      var best = -1, bestD = Infinity;
      lock.splitCuts.forEach(function(cut, idx){
        var dx = gx(cut.u)-px, dy = gy(cut.len)-py;
        var d = dx*dx+dy*dy;
        if(d < bestD){ bestD = d; best = idx; }
      });
      return bestD < 256 ? best : -1; // 16px radius
    }

    var dragIdx = -1;
    svg.addEventListener('pointerdown', function(e){
      e.preventDefault();
      var g = pxyFromEvent(e);
      var idx = findNearestIndex(g.px, g.py);
      pushUndoSnapshot();
      if(idx >= 0){
        dragIdx = idx;
      } else {
        lock.splitCuts.push({ u: invX(g.px), len: invY(g.py) });
        dragIdx = lock.splitCuts.length-1;
        regenerateLockGeometry(lock);
        redraw();
      }
      svg.setPointerCapture(e.pointerId);
    });
    svg.addEventListener('pointermove', function(e){
      if(dragIdx < 0) return;
      var g = pxyFromEvent(e);
      lock.splitCuts[dragIdx].u = invX(g.px);
      lock.splitCuts[dragIdx].len = invY(g.py);
      regenerateLockGeometry(lock);
      redraw();
    });
    function endDrag(){ dragIdx = -1; }
    svg.addEventListener('pointerup', endDrag);
    svg.addEventListener('pointercancel', endDrag);
    svg.addEventListener('dblclick', function(e){
      var g = pxyFromEvent(e);
      var idx = findNearestIndex(g.px, g.py);
      if(idx >= 0 && lock.splitCuts.length > 1){
        pushUndoSnapshot();
        lock.splitCuts.splice(idx, 1);
        regenerateLockGeometry(lock);
        redraw();
      }
    });

    field.appendChild(svg);
    var hint2 = document.createElement('div'); hint2.className = 'curve-hint';
    hint2.textContent = t('hint.splitCutsEditor');
    field.appendChild(hint2);
    wrap.appendChild(field);
  }

  var OPEN_THRESHOLD = 0.1;    // pinchAmount beyond which the bridging quad is actually omitted -> a real hole
  var RAMP_FRACTION = 0.3;     // reach full gap width within the first 30% of a cut's own length, then hold steady

  // Per-cut max separation, clamped to ~40% of the distance to the nearest neighboring cut (or
  // the strand's edge), so cuts placed close together (as in a tight cluster of thin slits) never
  // cross over into each other regardless of how close the user drags them.
  function safeGapWidths(cuts, gapWidth){
    var sorted = cuts.map(function(c,i){ return {u:c.u, i:i}; }).sort(function(a,b){ return a.u-b.u; });
    var widths = new Array(cuts.length);
    for(var k=0;k<sorted.length;k++){
      var u = sorted[k].u;
      var leftBound = k>0 ? sorted[k-1].u : -1;
      var rightBound = k<sorted.length-1 ? sorted[k+1].u : 1;
      var maxW = Math.min(u-leftBound, rightBound-u) * 0.42;
      widths[sorted[k].i] = Math.min(gapWidth, Math.max(0.01, maxW));
    }
    return widths;
  }

  // Cross-section perimeter for a ribbon with `cuts` ({u, len} objects). Each cut becomes TWO
  // points (a right-side and left-side copy) that start coincident (seamless, zero gap) and drift
  // apart in U as that cut's own pinchAmount increases -- a real widening slit, not just a thinner
  // web. `bridgesByCut`/`cutWalls` are indexed per cut, since each cut now opens independently
  // (its own length), not all in lockstep.
  function crossSectionPerimeter(cuts, gapWidths, pinchAmounts){
    if(!cuts || !cuts.length) return { pts: [[1,1],[-1,1],[-1,-1],[1,-1]], bridgesByCut: [], cutWalls: [] };
    var pts = [];
    var bridgesByCut = new Array(cuts.length);
    var cutWalls = new Array(cuts.length);
    pts.push([1,1]); // top-right corner
    var descOrder = cuts.map(function(c,i){ return {u:c.u, i:i}; }).sort(function(a,b){ return b.u-a.u; });
    descOrder.forEach(function(entry){
      var sep = pinchAmounts[entry.i] * gapWidths[entry.i];
      var iRight = pts.length; pts.push([Math.min(entry.u+sep, 0.99), 1]);
      var iLeft = pts.length; pts.push([Math.max(entry.u-sep, -0.99), 1]);
      bridgesByCut[entry.i] = { top: [iRight, iLeft] };
      cutWalls[entry.i] = { frontRight: iRight, frontLeft: iLeft };
    });
    pts.push([-1,1]); // top-left
    pts.push([-1,-1]); // bottom-left
    var ascOrder = cuts.map(function(c,i){ return {u:c.u, i:i}; }).sort(function(a,b){ return a.u-b.u; });
    ascOrder.forEach(function(entry){
      var sep = pinchAmounts[entry.i] * gapWidths[entry.i];
      var iLeft = pts.length; pts.push([Math.max(entry.u-sep, -0.99), -1]);
      var iRight = pts.length; pts.push([Math.min(entry.u+sep, 0.99), -1]);
      bridgesByCut[entry.i].bottom = [iLeft, iRight];
      cutWalls[entry.i].backLeft = iLeft;
      cutWalls[entry.i].backRight = iRight;
    });
    pts.push([1,-1]); // bottom-right
    return { pts: pts, bridgesByCut: bridgesByCut, cutWalls: cutWalls };
  }

  function buildStrandGeometry(baseCurve, width, depth, spread, seed, lengthVariation, rootNormal, waviness, thicknessCurve, splitEnds, splitCuts, splitGapWidth, roll){
    var tMax = Math.max(0.16, 1 - seed.lengthRand * (lengthVariation || 0));
    var effectiveLength = baseCurve.getLength() * tMax;
    var SEGMENTS = Math.max(8, Math.min(48, Math.round(effectiveLength / 0.045)));
    var positions = [];
    var uvs = [];
    waviness = waviness || 0;
    var cuts = (splitEnds && splitCuts && splitCuts.length) ? splitCuts : [];
    var gapW = splitGapWidth != null ? splitGapWidth : 0.11;
    var gapWidths = cuts.length ? safeGapWidths(cuts, gapW) : [];
    var RINGN = cuts.length ? (4 + cuts.length*4) : 4;

    var t0 = baseCurve.getTangentAt(0).normalize();
    var frame0 = initialFrame(t0, rootNormal);
    var curNormal = frame0.normal, curBinormal = frame0.binormal, prevTangent = t0;
    if(roll){
      var rollQuat = new THREE.Quaternion().setFromAxisAngle(t0, roll);
      curNormal = curNormal.clone().applyQuaternion(rollQuat);
      curBinormal = curBinormal.clone().applyQuaternion(rollQuat);
    }

    var curlFreq = 2.2 + waviness*3.6;
    var waveAmp = waviness * width * 9;
    var lastBridgesByCut = null, lastCutWalls = null;
    var pinchHistory = []; // per ring: array of pinchAmount per cut

    for(var i=0;i<=SEGMENTS;i++){
      var localT = i/SEGMENTS;              // 0..1 along THIS strand's own length
      var curveT = Math.min(localT*tMax, 0.999999);
      var p = baseCurve.getPointAt(curveT);
      var tangent = baseCurve.getTangentAt(curveT).normalize();
      if(i > 0){
        var q = new THREE.Quaternion().setFromUnitVectors(prevTangent, tangent);
        curNormal = curNormal.clone().applyQuaternion(q);
        curBinormal = curBinormal.clone().applyQuaternion(q);
        prevTangent = tangent;
      }
      var reach = Math.min(1, localT*2.2);
      var fan = seed.lateral * spread * localT * 0.55;
      var waveBin = Math.sin(localT*Math.PI*curlFreq + seed.phase) * waveAmp * reach;
      var waveNorm = Math.cos(localT*Math.PI*curlFreq + seed.phase) * waveAmp * 0.6 * reach;
      var vert = seed.vertical * spread * 0.14 * localT;
      var center = p.clone()
        .add(curBinormal.clone().multiplyScalar(fan+waveBin))
        .add(curNormal.clone().multiplyScalar(vert+waveNorm));
      if(seed.subOffset && seed.subOffset.lengthSq() > 0){
        center.add(seed.subOffset.clone().multiplyScalar(localT));
      }
      if(seed.rootOffset && seed.rootOffset.lengthSq() > 0){
        center.add(seed.rootOffset); // no localT scaling -- shifts the whole hair, root included
      }
      var profileMul = sampleThicknessCurve(thicknessCurve, localT);
      var halfW = Math.max(0.0006, width * Math.max(0, profileMul)) * 0.5;
      var halfD = Math.max(0.0003, depth * Math.max(0, profileMul)) * 0.5;

      var pinchAmounts = cuts.map(function(cut){
        var len = Math.max(0.02, cut.len != null ? cut.len : 0.15);
        var cutStart = Math.max(0.01, 1 - len);
        if(localT <= cutStart) return 0;
        var raw = (localT - cutStart) / (1 - cutStart);
        var ramped = Math.min(1, raw / RAMP_FRACTION);
        return ramped*ramped*(3-2*ramped); // reaches full width quickly, then holds steady
      });
      pinchHistory.push(pinchAmounts);

      var perimResult = crossSectionPerimeter(cuts, gapWidths, pinchAmounts);
      lastBridgesByCut = perimResult.bridgesByCut;
      lastCutWalls = perimResult.cutWalls;

      for(var c=0;c<perimResult.pts.length;c++){
        var pt = perimResult.pts[c];
        var ringPt = center.clone()
          .add(curBinormal.clone().multiplyScalar(pt[0]*halfW))
          .add(curNormal.clone().multiplyScalar(pt[1]*halfD));
        positions.push(ringPt.x, ringPt.y, ringPt.z);
        uvs.push(c/perimResult.pts.length, localT);
      }
    }

    var totalRings = SEGMENTS+1;
    var faces = [];
    for(var s=0;s<SEGMENTS;s++){
      var openPerCut = cuts.map(function(_,ci){ return pinchHistory[s][ci] > OPEN_THRESHOLD; });
      for(c=0;c<RINGN;c++){
        var c2 = (c+1)%RINGN;
        var skip = false;
        if(cuts.length && lastBridgesByCut){
          for(var ci=0; ci<cuts.length; ci++){
            if(!openPerCut[ci]) continue;
            var bt = lastBridgesByCut[ci].top, bb = lastBridgesByCut[ci].bottom;
            var mTop = (bt[0]===c && bt[1]===c2) || (bt[0]===c2 && bt[1]===c);
            var mBot = (bb[0]===c && bb[1]===c2) || (bb[0]===c2 && bb[1]===c);
            if(mTop || mBot){ skip = true; break; }
          }
        }
        if(skip) continue;
        var a=s*RINGN+c, b=s*RINGN+c2, d=(s+1)*RINGN+c2, cc=(s+1)*RINGN+c;
        faces.push([a,b,d,cc]);
      }
      // Close the exposed inner wall of each open cut, so you see a clean cut edge (with real
      // depth) rather than looking straight through into a hollow gap.
      if(lastCutWalls){
        cuts.forEach(function(_, ci){
          if(!openPerCut[ci]) return;
          var cw = lastCutWalls[ci];
          faces.push([cw.frontRight+s*RINGN, cw.backRight+s*RINGN, cw.backRight+(s+1)*RINGN, cw.frontRight+(s+1)*RINGN]);
          faces.push([cw.frontLeft+s*RINGN, cw.frontLeft+(s+1)*RINGN, cw.backLeft+(s+1)*RINGN, cw.backLeft+s*RINGN]);
        });
      }
    }
    // root cap: fan from vertex 0, reversed order for outward (-tangent) facing.
    // Valid even with the extra cut-vertices, since the root ring is always the flat
    // (un-notched) rectangle -- any extra points there just sit collinear on its edges.
    for(var f=1; f<RINGN-1; f++){
      faces.push([0, RINGN-f, RINGN-f-1]);
    }
    // tip cap: only for the plain (no cuts) case -- with cuts the tip is left open between
    // the now-separated strips, which is fine since it's rarely seen end-on.
    if(!cuts.length){
      var tipBase = (totalRings-1)*RINGN;
      faces.push([tipBase+0, tipBase+1, tipBase+2, tipBase+3]);
    }

    var indices = [];
    faces.forEach(function(f){
      if(f.length === 3) indices.push(f[0], f[1], f[2]);
      else indices.push(f[0], f[1], f[2], f[0], f[2], f[3]);
    });

    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs,2));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return { geometry: geo, quads: faces };
  }

  function ensureSeeds(lock){
    if(!lock.seeds) lock.seeds = [];
    while(lock.seeds.length < lock.density) lock.seeds.push(randomSeed());
    lock.seeds.length = lock.density;
  }

  // Gives the currently picked single hair its own glowing material so it reads clearly
  // against the rest of the lock. Meshes are fully rebuilt on every regenerate, so this has
  // to be re-applied each time -- regenerateLockGeometry calls it below for the owning lock.
  function singleHairHighlightMaterial(lock){
    return new THREE.MeshStandardMaterial({
      color: new THREE.Color(lock.color).lerp(new THREE.Color(0xffffff), 0.4),
      emissive: new THREE.Color(0xff5da8),
      emissiveIntensity: 0.6,
      roughness: 0.35,
      metalness: 0.06,
      side: THREE.DoubleSide
    });
  }
  function applySingleHairHighlight(lock){
    if(selectedHairSeedIndex == null || selectedHairSeedIndex >= lock.seeds.length){
      selectedHairLockId = null;
      selectedHairSeedIndex = null;
      return;
    }
    var mesh = lock.group.children.find(function(m){ return m.userData.seedIndex === selectedHairSeedIndex; });
    if(mesh) mesh.material = singleHairHighlightMaterial(lock);
  }
  function clearSingleHairSelection(){
    if(selectedHairLockId == null && selectedHairSeedIndex == null) return;
    var prevLock = getLock(selectedHairLockId);
    selectedHairLockId = null;
    selectedHairSeedIndex = null;
    if(prevLock) regenerateLockGeometry(prevLock);
  }

  function regenerateLockGeometry(lock, skipMirrorSync){
    while(lock.group.children.length){
      var c = lock.group.children.pop();
      c.geometry.dispose();
      c.material.dispose();
    }
    ensureSeeds(lock);
    if(lock.points.length < 2) return;
    var meshOffset = lock.meshOffset || 0;
    var curvePoints = lock.points;
    if(meshOffset){
      curvePoints = lock.points.map(function(p){
        var dir = p.lengthSq() > 1e-8 ? p.clone().normalize() : new THREE.Vector3(0,1,0);
        return p.clone().addScaledVector(dir, meshOffset);
      });
    }
    var baseCurve = new THREE.CatmullRomCurve3(curvePoints, false, 'centripetal', 0.5);
    var rootNormal = (meshDirectionEnabled && curvePoints[0].lengthSq() > 1e-8) ? curvePoints[0].clone().normalize() : new THREE.Vector3(0,1,0);
    var material = new THREE.MeshStandardMaterial({
      color: new THREE.Color(lock.color),
      roughness: 0.55,
      metalness: 0.06,
      side: THREE.DoubleSide
    });
    lock.material = material;
    if(!lock.thicknessCurve) lock.thicknessCurve = defaultThicknessCurve();
    for(var s=0;s<lock.density;s++){
      var splitActive = lock.hairType === 'blunt' && lock.splitEnds;
      var built = buildStrandGeometry(baseCurve, lock.thickness, lock.depth, lock.spread, lock.seeds[s], lock.lengthVariation, rootNormal, lock.waviness, lock.thicknessCurve, splitActive, lock.splitCuts, lock.splitGapWidth, lock.roll || 0);
      var mesh = new THREE.Mesh(built.geometry, material);
      mesh.userData.lockId = lock.id;
      mesh.userData.seedIndex = s;
      mesh.userData.quads = built.quads;
      lock.group.add(mesh);
    }
    if(lock.id === selectedHairLockId) applySingleHairHighlight(lock);
    if(selectedLockId === lock.id) updateSelectionRing();
    if(selectedLockId === lock.id) updateRollGizmo();
    if(!skipMirrorSync) syncMirrorPartner(lock);
  }

  // While a mirrored pair is linked, editing one live-mirrors the other (points, shape and
  // style) across the X=0 plane -- points, sliders, brush strokes, trims, all of it, since
  // they all funnel through regenerateLockGeometry. skipMirrorSync=true on the partner's own
  // regenerate call prevents this from bouncing back and forth between the pair.
  function syncMirrorPartner(lock){
    if(!lock.mirrorLinked || !lock.mirrorPairId) return;
    var partner = getLock(lock.mirrorPairId);
    if(!partner) return;
    partner.points = lock.points.map(function(p){ return new THREE.Vector3(-p.x, p.y, p.z); });
    partner.thickness = lock.thickness;
    partner.depth = lock.depth;
    partner.meshOffset = lock.meshOffset || 0;
    partner.roll = -(lock.roll || 0);
    partner.density = lock.density;
    partner.spread = lock.spread;
    partner.lengthVariation = lock.lengthVariation;
    partner.waviness = lock.waviness;
    partner.thicknessCurve = lock.thicknessCurve.map(function(pt){ return {t:pt.t, v:pt.v, type:pt.type||'spline', handleDt:pt.handleDt, handleDv:pt.handleDv}; });
    partner.hairType = lock.hairType;
    partner.splitEnds = lock.splitEnds;
    partner.splitCuts = lock.splitCuts.map(function(cut){ return {u:cut.u, len:cut.len}; });
    partner.splitGapWidth = lock.splitGapWidth;
    ensureSeeds(partner);
    partner.seeds = lock.seeds.map(function(s){
      return {
        lateral: -s.lateral, vertical: s.vertical, phase: s.phase, lengthRand: s.lengthRand,
        subOffset: new THREE.Vector3(-s.subOffset.x, s.subOffset.y, s.subOffset.z),
        rootOffset: new THREE.Vector3(-(s.rootOffset ? s.rootOffset.x : 0), s.rootOffset ? s.rootOffset.y : 0, s.rootOffset ? s.rootOffset.z : 0)
      };
    });
    regenerateLockGeometry(partner, true);
    buildMarkers(partner);
    if(selectedLockId === partner.id) updateSelectionRing();
    if(selectedLockId === partner.id) updateRollGizmo();
  }

  function buildMarkers(lock){
    while(lock.markerGroup.children.length){
      var c = lock.markerGroup.children.pop();
      if(c.geometry) c.geometry.dispose();
      if(c.material) c.material.dispose();
    }
    for(var i=0;i<lock.points.length;i++){
      var geo = new THREE.SphereGeometry(0.026, 12, 12);
      var mat = new THREE.MeshBasicMaterial({color: i===0 ? 0xffffff : 0xd8d3e0, depthTest:false, depthWrite:false});
      var m = new THREE.Mesh(geo, mat);
      m.position.copy(lock.points[i]);
      m.renderOrder = 999;
      m.userData.lockId = lock.id;
      m.userData.pointIndex = i;
      lock.markerGroup.add(m);
    }
    // small "insert point" handles at each segment midpoint (click to subdivide the curve there)
    for(var s=0;s<lock.points.length-1;s++){
      var mid = lock.points[s].clone().lerp(lock.points[s+1], 0.5);
      var igeo = new THREE.SphereGeometry(0.015, 8, 8);
      var imat = new THREE.MeshBasicMaterial({color:0xff5da8, transparent:true, opacity:0.65, depthTest:false, depthWrite:false});
      var im = new THREE.Mesh(igeo, imat);
      im.position.copy(mid);
      im.renderOrder = 998;
      im.userData.lockId = lock.id;
      im.userData.isInsertMarker = true;
      im.userData.insertAfterIndex = s;
      lock.markerGroup.add(im);
    }
    var lineGeo = new THREE.BufferGeometry().setFromPoints(lock.points);
    var lineMat = new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:0.25, depthTest:false, depthWrite:false});
    var line = new THREE.Line(lineGeo, lineMat);
    line.renderOrder = 997;
    line.userData.isGuideLine = true;
    lock.markerGroup.add(line);
  }

  function insertPointIntoLock(lock, afterIndex, point){
    pushUndoSnapshot();
    lock.points.splice(afterIndex+1, 0, point.clone());
    regenerateLockGeometry(lock);
    buildMarkers(lock);
    lock.markerGroup.visible = (mode === 'edit' || mode === 'trim');
  }

  function trimLockAt(lock, index){
    if(index <= 0 || index >= lock.points.length-1) return; // keep at least root+1 point, no-op if already the tip
    pushUndoSnapshot();
    lock.points.length = index+1;
    regenerateLockGeometry(lock);
    buildMarkers(lock);
    lock.markerGroup.visible = (mode === 'edit' || mode === 'trim');
  }

  function updateSelectionRing(){
    var lock = getLock(selectedLockId);
    if(!lock){ selectionRing.visible = false; return; }
    selectionRing.visible = true;
    selectionRing.position.copy(lock.points[0]);
    selectionRing.material.color.set(lock.color);
    selectionRing.lookAt(camera.position);
  }

  function updateRollGizmo(){
    var lock = getLock(selectedLockId);
    if(mode !== 'rotate' || !lock || lock.points.length < 2){ rollGizmo.visible = false; return; }
    rollGizmo.visible = true;
    rollGizmo.position.copy(lock.points[0]);
    var tangent = lock.points[1].clone().sub(lock.points[0]);
    if(tangent.lengthSq() < 1e-10) tangent.set(0,1,0); else tangent.normalize();
    var quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1), tangent);
    rollGizmo.quaternion.copy(quat);
  }

  /* ============================================================
     LOCK CRUD
  ============================================================ */
  function getLock(id){
    for(var i=0;i<locks.length;i++) if(locks[i].id===id) return locks[i];
    return null;
  }

  function createLock(points){
    lockCounter++;
    var lock = {
      id: 'lock_'+Date.now()+'_'+lockCounter,
      name: 'Lock ' + lockCounter,
      points: points.map(function(p){ return p.clone(); }),
      thickness: 0.052,
      depth: 0.022,
      meshOffset: 0,
      roll: 0,
      density: 6,
      spread: 0.3,
      lengthVariation: 0.22,
      waviness: 0.2,
      thicknessCurve: defaultThicknessCurve(),
      hairType: 'natural',
      splitEnds: false,
      splitCuts: [{u:-0.42, len:0.4}, {u:-0.24, len:0.4}],
      splitGapWidth: 0.11,
      color: PALETTE[(lockCounter-1) % PALETTE.length],
      group: new THREE.Group(),
      markerGroup: new THREE.Group(),
      seeds: null,
      material: null
    };
    scene.add(lock.group);
    scene.add(lock.markerGroup);
    lock.markerGroup.visible = false;
    ensureSeeds(lock);
    regenerateLockGeometry(lock);
    buildMarkers(lock);
    locks.push(lock);
    selectLock(lock.id);
    return lock;
  }

  // Creates an X-mirrored copy of `sourceLock` (points reflected across the X=0 plane),
  // matching its style parameters and mirroring its strand fan pattern for a true reflection.
  // The pair is named with _L/_R side suffixes and linked for live mirrored editing.
  function createMirroredLock(sourceLock){
    var mirroredPoints = sourceLock.points.map(function(p){ return new THREE.Vector3(-p.x, p.y, p.z); });
    var mirror = createLock(mirroredPoints);
    mirror.thickness = sourceLock.thickness;
    mirror.depth = sourceLock.depth;
    mirror.meshOffset = sourceLock.meshOffset || 0;
    mirror.roll = -(sourceLock.roll || 0);
    mirror.density = sourceLock.density;
    mirror.spread = sourceLock.spread;
    mirror.lengthVariation = sourceLock.lengthVariation;
    mirror.waviness = sourceLock.waviness;
    mirror.thicknessCurve = sourceLock.thicknessCurve.map(function(pt){ return {t:pt.t, v:pt.v, type:pt.type||'spline', handleDt:pt.handleDt, handleDv:pt.handleDv}; });
    mirror.hairType = sourceLock.hairType;
    mirror.splitEnds = sourceLock.splitEnds;
    mirror.splitCuts = sourceLock.splitCuts.map(function(c){ return {u:c.u, len:c.len}; });
    mirror.splitGapWidth = sourceLock.splitGapWidth;
    mirror.color = sourceLock.color;
    ensureSeeds(mirror);
    mirror.seeds = sourceLock.seeds.map(function(s){
      return {
        lateral: -s.lateral, vertical: s.vertical, phase: s.phase, lengthRand: s.lengthRand,
        subOffset: new THREE.Vector3(-s.subOffset.x, s.subOffset.y, s.subOffset.z),
        rootOffset: new THREE.Vector3(-(s.rootOffset ? s.rootOffset.x : 0), s.rootOffset ? s.rootOffset.y : 0, s.rootOffset ? s.rootOffset.z : 0)
      };
    });

    var sourceIsLeft = sourceLock.points[0].x < 0;
    var baseName = sourceLock.name.replace(/_[LR]$/, '');
    sourceLock.name = baseName + (sourceIsLeft ? '_L' : '_R');
    mirror.name = baseName + (sourceIsLeft ? '_R' : '_L');

    sourceLock.mirrorPairId = mirror.id; sourceLock.mirrorLinked = true;
    mirror.mirrorPairId = sourceLock.id; mirror.mirrorLinked = true;

    regenerateLockGeometry(mirror, true);
    buildMarkers(mirror);
    return mirror;
  }

  // Exact copy of `sourceLock` (not mirrored, no pairing), nudged slightly in X so it's
  // immediately visible and selectable as a separate lock rather than sitting exactly on top.
  function duplicateLock(sourceLock){
    var nudge = 0.035;
    var copiedPoints = sourceLock.points.map(function(p){ return new THREE.Vector3(p.x+nudge, p.y, p.z); });
    var dup = createLock(copiedPoints);
    dup.thickness = sourceLock.thickness;
    dup.depth = sourceLock.depth;
    dup.meshOffset = sourceLock.meshOffset || 0;
    dup.roll = sourceLock.roll || 0;
    dup.density = sourceLock.density;
    dup.spread = sourceLock.spread;
    dup.lengthVariation = sourceLock.lengthVariation;
    dup.waviness = sourceLock.waviness;
    dup.thicknessCurve = sourceLock.thicknessCurve.map(function(pt){ return {t:pt.t, v:pt.v, type:pt.type||'spline', handleDt:pt.handleDt, handleDv:pt.handleDv}; });
    dup.hairType = sourceLock.hairType;
    dup.splitEnds = sourceLock.splitEnds;
    dup.splitCuts = sourceLock.splitCuts.map(function(c){ return {u:c.u, len:c.len}; });
    dup.splitGapWidth = sourceLock.splitGapWidth;
    dup.color = sourceLock.color;
    dup.name = sourceLock.name + ' copy';
    ensureSeeds(dup);
    dup.seeds = sourceLock.seeds.map(function(s){
      return {
        lateral: s.lateral, vertical: s.vertical, phase: s.phase, lengthRand: s.lengthRand,
        subOffset: s.subOffset.clone(),
        rootOffset: (s.rootOffset || new THREE.Vector3(0,0,0)).clone()
      };
    });
    regenerateLockGeometry(dup);
    buildMarkers(dup);
    return dup;
  }

  function deleteLock(id){
    var lock = getLock(id);
    if(!lock) return;
    pushUndoSnapshot();
    if(lock.mirrorPairId){
      var partner = getLock(lock.mirrorPairId);
      if(partner){ partner.mirrorPairId = null; partner.mirrorLinked = false; }
    }
    scene.remove(lock.group);
    scene.remove(lock.markerGroup);
    lock.group.children.forEach(function(m){ m.geometry.dispose(); m.material.dispose(); });
    lock.markerGroup.children.forEach(function(m){ if(m.geometry) m.geometry.dispose(); if(m.material) m.material.dispose(); });
    locks = locks.filter(function(l){ return l.id !== id; });
    if(selectedLockId === id) selectLock(null);
    renderSidebar();
  }

  function selectLock(id){
    if(id !== selectedHairLockId) clearSingleHairSelection();
    selectedLockId = id;
    locks.forEach(function(l){ l.markerGroup.visible = (markersVisibleForMode() && l.id === id); });
    updateSelectionRing();
    updateRollGizmo();
    renderSidebar();
    updateToolbarState();
  }

  function appendPointToLock(lock, point){
    pushUndoSnapshot();
    lock.points.push(point.clone());
    regenerateLockGeometry(lock);
    buildMarkers(lock);
    lock.markerGroup.visible = markersVisibleForMode();
  }

  function deletePointFromLock(lock, index){
    if(lock.points.length <= 2) return;
    pushUndoSnapshot();
    lock.points.splice(index, 1);
    regenerateLockGeometry(lock);
    buildMarkers(lock);
    lock.markerGroup.visible = markersVisibleForMode();
  }

  /* ============================================================
     UNDO / REDO
  ============================================================ */
  var undoStack = [];
  var redoStack = [];
  var MAX_UNDO = 60;

  function snapshotState(){
    return {
      lockCounter: lockCounter,
      selectedLockId: selectedLockId,
      locks: locks.map(function(l){
        return {
          id: l.id, name: l.name, color: l.color,
          thickness: l.thickness, depth: l.depth || 0.022, meshOffset: l.meshOffset || 0, roll: l.roll || 0, density: l.density, spread: l.spread,
          lengthVariation: l.lengthVariation, waviness: l.waviness,
          thicknessCurve: (l.thicknessCurve || defaultThicknessCurve()).map(function(pt){ return {t:pt.t, v:pt.v, type:pt.type||'spline', handleDt:pt.handleDt, handleDv:pt.handleDv}; }),
          hairType: l.hairType || 'natural',
          splitEnds: !!l.splitEnds, splitCuts: (l.splitCuts || []).map(function(c){ return {u:c.u, len:c.len}; }), splitGapWidth: l.splitGapWidth != null ? l.splitGapWidth : 0.11,
          mirrorPairId: l.mirrorPairId || null, mirrorLinked: !!l.mirrorLinked,
          points: l.points.map(function(p){ return [p.x, p.y, p.z]; }),
          seeds: (l.seeds || []).map(function(s){
            return {
              lateral: s.lateral, vertical: s.vertical, phase: s.phase, lengthRand: s.lengthRand,
              subOffset: [s.subOffset.x, s.subOffset.y, s.subOffset.z],
              rootOffset: s.rootOffset ? [s.rootOffset.x, s.rootOffset.y, s.rootOffset.z] : [0,0,0]
            };
          })
        };
      })
    };
  }

  function pushUndoSnapshot(){
    undoStack.push(snapshotState());
    if(undoStack.length > MAX_UNDO) undoStack.shift();
    redoStack.length = 0;
  }

  function disposeAllLocks(){
    locks.forEach(function(l){
      scene.remove(l.group);
      scene.remove(l.markerGroup);
      l.group.children.forEach(function(m){ m.geometry.dispose(); m.material.dispose(); });
      l.markerGroup.children.forEach(function(m){ if(m.geometry) m.geometry.dispose(); if(m.material) m.material.dispose(); });
    });
    locks = [];
  }

  // Rebuilds a live lock object (with THREE groups, geometry, markers) from a saved plain-object
  // shape (the same shape snapshotState() produces per lock). Shared by undo/redo restore and
  // project load so the two never drift out of sync with each other.
  function buildLockFromSaved(ls){
    var lock = {
      id: ls.id, name: ls.name, color: ls.color,
      thickness: ls.thickness, depth: ls.depth || 0.022, meshOffset: ls.meshOffset || 0, roll: ls.roll || 0, density: ls.density, spread: ls.spread,
      lengthVariation: ls.lengthVariation, waviness: ls.waviness,
      thicknessCurve: (ls.thicknessCurve || defaultThicknessCurve()).map(function(pt){ return {t:pt.t, v:pt.v, type:pt.type||'spline', handleDt:pt.handleDt, handleDv:pt.handleDv}; }),
      hairType: ls.hairType || 'natural',
      splitEnds: !!ls.splitEnds, splitCuts: (ls.splitCuts || []).map(function(c){ return {u:c.u, len:c.len}; }), splitGapWidth: ls.splitGapWidth != null ? ls.splitGapWidth : 0.11,
      mirrorPairId: ls.mirrorPairId || null, mirrorLinked: !!ls.mirrorLinked,
      points: ls.points.map(function(p){ return new THREE.Vector3(p[0], p[1], p[2]); }),
      group: new THREE.Group(), markerGroup: new THREE.Group(),
      seeds: ls.seeds.map(function(s){
        return {
          lateral: s.lateral, vertical: s.vertical, phase: s.phase, lengthRand: s.lengthRand,
          subOffset: new THREE.Vector3(s.subOffset[0], s.subOffset[1], s.subOffset[2]),
          rootOffset: s.rootOffset ? new THREE.Vector3(s.rootOffset[0], s.rootOffset[1], s.rootOffset[2]) : new THREE.Vector3(0,0,0)
        };
      }),
      material: null
    };
    scene.add(lock.group);
    scene.add(lock.markerGroup);
    lock.markerGroup.visible = false;
    regenerateLockGeometry(lock, true);
    buildMarkers(lock);
    locks.push(lock);
    return lock;
  }

  function restoreState(snap){
    disposeAllLocks();
    snap.locks.forEach(buildLockFromSaved);
    lockCounter = snap.lockCounter;
    selectedLockId = (snap.selectedLockId && getLock(snap.selectedLockId)) ? snap.selectedLockId : null;
    locks.forEach(function(l){ l.markerGroup.visible = (markersVisibleForMode() && l.id === selectedLockId); });
    updateSelectionRing();
    updateRollGizmo();
    renderSidebar();
    updateToolbarState();
  }

  function undo(){
    if(!undoStack.length) return;
    redoStack.push(snapshotState());
    var snap = undoStack.pop();
    restoreState(snap);
    showToast(t('toast.undone'), null, 1200);
  }
  function redo(){
    if(!redoStack.length) return;
    undoStack.push(snapshotState());
    var snap = redoStack.pop();
    restoreState(snap);
    showToast(t('toast.redone'), null, 1200);
  }

  /* ============================================================
     DRAFT CURVE (ADD MODE)
  ============================================================ */
  var draftFinishBtn = document.getElementById('draft-finish');
  var draftActionsEl = document.getElementById('draft-actions');

  function addDraftPoint(point){
    draftPoints.push(point.clone());
    var m = new THREE.Mesh(new THREE.SphereGeometry(0.022,10,10), new THREE.MeshBasicMaterial({color:0xffffff}));
    m.position.copy(point);
    draftMarkerGroup.add(m);
    refreshDraftLine();
    draftFinishBtn.disabled = draftPoints.length < 2;
    updateHint();
  }
  function refreshDraftLine(){
    if(draftLine){ scene.remove(draftLine); draftLine.geometry.dispose(); draftLine.material.dispose(); draftLine=null; }
    if(draftPoints.length > 1){
      var geo = new THREE.BufferGeometry().setFromPoints(draftPoints);
      var mat = new THREE.LineBasicMaterial({color:0xff5da8});
      draftLine = new THREE.Line(geo, mat);
      scene.add(draftLine);
    }
  }
  function clearDraft(){
    draftPoints = [];
    while(draftMarkerGroup.children.length){
      var c = draftMarkerGroup.children.pop();
      c.geometry.dispose(); c.material.dispose();
    }
    if(draftLine){ scene.remove(draftLine); draftLine.geometry.dispose(); draftLine.material.dispose(); draftLine=null; }
    draftFinishBtn.disabled = true;
    updateHint();
  }
  function finishDraft(){
    if(draftPoints.length >= 2){
      pushUndoSnapshot();
      var newLock = createLock(draftPoints);
      if(symmetryEnabled){ createMirroredLock(newLock); selectLock(newLock.id); }
      clearDraft();
      setMode('view');
    }
  }

  var symmetryIndicatorEl = document.getElementById('symmetry-indicator');
  var symmetryTextEl = document.getElementById('symmetry-text');
  function setSymmetryEnabled(val){

    symmetryIndicatorEl.classList.toggle('on', symmetryEnabled);

  var magnetIndicatorEl = document.getElementById('magnet-indicator');

  }
  magnetIndicatorEl.addEventListener('click', function(){ setMagnetEnabled(!magnetEnabled); });

  var directionIndicatorEl = document.getElementById('direction-indicator');
  var directionTextEl = document.getElementById('direction-text');
  function setMeshDirectionEnabled(val){

    directionIndicatorEl.classList.toggle('on', meshDirectionEnabled);
    directionTextEl.textContent = t('indicator.direction.label') + ': ' + (meshDirectionEnabled ? t('state.on') : t('state.off'));
    locks.forEach(function(l){ regenerateLockGeometry(l); });

  /* ============================================================
     MODE + TOOLBAR
  ============================================================ */
  var toolbarEl = document.getElementById('toolbar');
  var hintTextEl = document.getElementById('hint-text');
  var deleteBtn = document.getElementById('delete-btn');
  var duplicateBtn = document.getElementById('duplicate-btn');
  var mirrorBtn = document.getElementById('mirror-btn');

  function setMode(newMode){
    if(mode === 'add' && newMode !== 'add') clearDraft();
    mode = newMode;
    locks.forEach(function(l){ l.markerGroup.visible = (markersVisibleForMode() && l.id === selectedLockId); });

      btn.classList.toggle('active', btn.dataset.mode === mode);
    });

  function updateHint(){
    var txt;
    if(activeBrush === 'move'){
      txt = selectedLockId ? t('hint.brush.selected') : t('hint.brush.none');
    } else if(activeBrush === 'single'){
      txt = selectedLockId ? (detachHairRoot ? t('hint.brush.single.selectedDetached') : t('hint.brush.single.selected')) : t('hint.brush.single.none');
    } else if(mode === 'add'){
      txt = draftPoints.length === 0 ? t('hint.add.start') : t('hint.add.continue', {n: draftPoints.length});
    } else if(mode === 'edit'){
      txt = selectedLockId ? t('hint.edit.selected') : t('hint.selectPrompt');
    } else if(mode === 'trim'){
      txt = selectedLockId ? t('hint.trim.selected') : t('hint.selectPrompt');
    } else if(mode === 'rotate'){
      txt = selectedLockId ? t('hint.rotate.selected') : t('hint.selectPrompt');

      txt = t('hint.view');

    hintTextEl.textContent = txt;

  duplicateBtn.addEventListener('click', function(){

  mirrorBtn.addEventListener('click', function(){

  function round4(n){ return Math.round(n*10000)/10000; }

  function downloadBlob(content, filename, mime){
    var blob = new Blob([content], {type: mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  /* ---------------- save / load full project ---------------- */
  function saveProject(){
    var snap = snapshotState();
    var headGeo = headMesh.geometry;
    var headPos = headGeo.attributes.position.array;
    var headIdx = headGeo.index ? headGeo.index.array : new Uint32Array(0);
    var project = {
      version: 1,
      lockCounter: snap.lockCounter,
      locks: snap.locks,
      head: packMeshToB64(headPos, headIdx),
      references: referenceObjects.map(function(ref){
        var g = ref.mesh.geometry;
        var pos = g.attributes.position.array;
        var idx = g.index ? g.index.array : new Uint32Array(0);
        return {
          name: ref.name,
          mesh: packMeshToB64(pos, idx),
          position: [ref.mesh.position.x, ref.mesh.position.y, ref.mesh.position.z],
          rotation: [ref.mesh.rotation.x, ref.mesh.rotation.y, ref.mesh.rotation.z],
          scale: [ref.mesh.scale.x, ref.mesh.scale.y, ref.mesh.scale.z],
          visible: ref.mesh.visible
        };
      })
    };
    downloadBlob(JSON.stringify(project), 'lokon-project.json', 'application/json');
    showToast(t('toast.projectSaved'), 'success');
  }

  function loadProject(jsonText){
    var project;
    try{
      project = JSON.parse(jsonText);
    } catch(err){
      showToast(t('toast.projectFileCorrupt'), 'error', 5000);
      return;
    }
    try{
      disposeAllLocks();
      referenceObjects.slice().forEach(function(r){ deleteReferenceObject(r.id); });
      undoStack.length = 0; redoStack.length = 0;

      if(project.head){
        var headData = unpackMeshFromB64(project.head);
        applyImportedHeadGeometry(headData.positions, headData.indices);
      }

      (project.locks || []).forEach(buildLockFromSaved);
      lockCounter = project.lockCounter || locks.length;

      (project.references || []).forEach(function(refData){
        var meshData = unpackMeshFromB64(refData.mesh);
        var refObj = addReferenceObject(meshData.positions, meshData.indices, refData.name, null, {
          position: refData.position, rotation: refData.rotation, scale: refData.scale
        });
        if(refData.visible === false) refObj.mesh.visible = false;
      });

      selectedLockId = null;
      selectedRefId = null;
      locks.forEach(function(l){ l.markerGroup.visible = false; });
      updateSelectionRing();
      updateRollGizmo();
      renderSidebar();
      renderReferenceList();
      updateToolbarState();
      showToast(t('toast.projectLoaded', {locks: (project.locks||[]).length, refs: (project.references||[]).length}), 'success');
    } catch(err){
      showToast(t('toast.projectRestoreError', {msg: err.message}), 'error', 6000);
    }
  }

  /* ---------------- toast ---------------- */

  function showToast(msg, kind, duration){
    toastEl.textContent = msg;
    toastEl.className = kind ? kind : '';
    requestAnimationFrame(function(){ toastEl.classList.add('show'); });
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, duration || 3200);
  }

  /* ---------------- export (OBJ + MTL) ---------------- */
  function gatherMeshesData(){
    return locks.map(function(lock){
      var merged = mergeLockGeometry(lock);
      return { name: sanitizeFbxName(lock.name), color: lock.color, positions: merged.positions, uvs: merged.uvs, quads: merged.quads };
    });
  }

  document.getElementById('export-btn').addEventListener('click', function(){
    if(!locks.length){ showToast(t('toast.noStrandsToExport'), 'error'); return; }
    try{
      var result = LokonFBXExport.exportMeshesToOBJ(gatherMeshesData(), 'lokon-hair.mtl');
      downloadBlob(result.obj, 'lokon-hair.obj', 'text/plain');
      setTimeout(function(){ downloadBlob(result.mtl, 'lokon-hair.mtl', 'text/plain'); }, 300);
      showToast(t('toast.exported'), 'success', 5000);
    } catch(err){
      showToast(t('toast.exportError', {msg: err.message}), 'error');
    }
  });

  function sanitizeFbxName(name){
    return String(name).replace(/[^\w -]/g, '').trim() || 'Lock';
  }

  // Merge every strand mesh inside a lock's THREE.Group into one flat positions/indices pair.
  function mergeLockGeometry(lock){
    var positions = [];
    var uvs = [];
    var quads = [];
    var vertOffset = 0;
    lock.group.children.forEach(function(mesh){
      var posAttr = mesh.geometry.attributes.position;
      var uvAttr = mesh.geometry.attributes.uv;
      for(var i=0;i<posAttr.count;i++){
        positions.push(posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i));
        uvs.push(uvAttr.getX(i), uvAttr.getY(i));
      }
      (mesh.userData.quads || []).forEach(function(q){
        quads.push(q.map(function(idx){ return vertOffset+idx; }));
      });
      vertOffset += posAttr.count;
    });
    return { positions: positions, uvs: uvs, quads: quads };
  }

  function processImportedHead(data, filename, isObj){
    try{
      var result = isObj ? LokonFBXParse.importOBJ(data) : LokonFBXParse.importFBX(data);
      if(!result.positions.length || !result.indices.length){
        showToast(t('toast.noMeshInFile'), 'error');
        return;
      }
      applyImportedHeadGeometry(result.positions, result.indices);
      showToast(t('toast.headImported', {name: filename, n: Math.round(result.positions.length/3)}), 'success');
    } catch(err){
      showToast(t('toast.readFileErrorWithMsg', {msg: err.message}), 'error', 5000);
    }
  }

  /* ---------------- reference object import (multiple files at once) ---------------- */
  var refFileInput = document.getElementById('ref-file-input');
  document.getElementById('import-ref-btn').addEventListener('click', function(){ refFileInput.click(); });
  refFileInput.addEventListener('change', function(){
    var files = Array.prototype.slice.call(refFileInput.files || []);
    refFileInput.value = '';
    if(!files.length) return;
    showToast(t('toast.importingRefs', {n: files.length}), null, 8000);
    // process sequentially so multiple large FBX files don't jam the reader
    function next(i){
      if(i >= files.length){
        showToast(t('toast.refsImported', {n: files.length}), 'success');
        return;
      }
      var file = files[i];
      var isObj = /\.obj$/i.test(file.name);
      var reader = new FileReader();
      reader.onload = function(){
        setTimeout(function(){
          try{
            var result = isObj ? LokonFBXParse.importOBJ(reader.result) : LokonFBXParse.importFBX(reader.result);
            if(result.positions.length && result.indices.length){
              addReferenceObject(result.positions, result.indices, file.name);
            } else {
              showToast(t('toast.noMeshInFileNamed', {name: file.name}), 'error');
            }
          } catch(err){
            showToast(t('toast.refFileError', {name: file.name, msg: err.message}), 'error', 5000);
          }
          next(i+1);
        }, 10);
      };
      reader.onerror = function(){ showToast(t('toast.readFileErrorNamed', {name: file.name}), 'error'); next(i+1); };
      if(isObj) reader.readAsText(file);
      else reader.readAsArrayBuffer(file);
    }
    next(0);
  });

  /* ============================================================
     POINTER / INTERACTION
  ============================================================ */
  var pointerDown = false;
  var dragMoved = false;
  var startX = 0, startY = 0, lastX = 0, lastY = 0;
  var activeButton = 0;

  function allLockMeshes(){
    var out = [];
    locks.forEach(function(l){ l.group.children.forEach(function(m){ out.push(m); }); });
    return out;
  }
  function allMarkerMeshes(lock){
    return lock.markerGroup.children.filter(function(c){ return !c.userData.isGuideLine; });
  }
  function pointMarkerMeshes(lock){
    return lock.markerGroup.children.filter(function(c){ return c.userData.pointIndex !== undefined; });
  }
  function insertMarkerMeshes(lock){
    return lock.markerGroup.children.filter(function(c){ return c.userData.isInsertMarker; });
  }
  var _closestTmp = new THREE.Vector3();
  function closestDistanceOnStrand(mesh, point){
    var posAttr = mesh.geometry.attributes.position;
    var minD = Infinity;
    for(var i=0;i<posAttr.count;i+=4){ // one sample per ring is plenty (rings are close together)
      _closestTmp.set(posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i));
      var d = _closestTmp.distanceTo(point);
      if(d < minD) minD = d;
    }
    return minD;
  }
  function brushFalloff(dist, radius){
    var t = 1 - Math.min(1, dist/radius);
    return t*t*(3-2*t); // smoothstep: 1 at center, 0 at the radius edge
  }

  viewportEl.addEventListener('pointerdown', function(e){
    setNdcFromEvent(e);
    pointerDown = true; dragMoved = false;
    startX = lastX = e.clientX; startY = lastY = e.clientY;
    activeButton = e.button;
    viewportEl.setPointerCapture(e.pointerId);

    if(activeBrush === 'move' && selectedLockId){
      var lockB = getLock(selectedLockId);
      if(lockB){
        var hitB = raycastObjects(lockB.group.children);
        if(hitB){
          var center = hitB.point.clone();
          var affected = [];
          lockB.group.children.forEach(function(strandMesh){
            var d = closestDistanceOnStrand(strandMesh, center);
            if(d <= brushRadius){
              var seed = lockB.seeds[strandMesh.userData.seedIndex];
              affected.push({ seed: seed, weight: brushFalloff(d, brushRadius) });
            }
          });
          if(affected.length){
            pushUndoSnapshot();
            brushDrag = { lock: lockB, affected: affected, refPoint: center };
          }
          return;
        }
      }
    }

    if(activeBrush === 'single' && selectedLockId){
      var lockS = getLock(selectedLockId);
      if(lockS){
        var hitS = raycastObjects(lockS.group.children);
        if(hitS){
          pushUndoSnapshot();
          var seedIdxS = hitS.object.userData.seedIndex;
          selectedHairLockId = lockS.id;
          selectedHairSeedIndex = seedIdxS;
          singleHairDrag = { lock: lockS, seed: lockS.seeds[seedIdxS], refPoint: hitS.point.clone() };
          regenerateLockGeometry(lockS);
          return;
        }
      }
    }

    if(mode === 'rotate' && selectedLockId){
      var lockR = getLock(selectedLockId);
      if(lockR && lockR.points.length >= 2){
        pushUndoSnapshot();
        var centerPx = worldToScreen(lockR.points[0]);
        var dxR = e.clientX - centerPx.x, dyR = e.clientY - centerPx.y;
        rollDrag = { lock: lockR, centerPx: centerPx, startAngle: Math.atan2(dyR, dxR), startRoll: lockR.roll || 0 };
        return;
      }
    }

    if(mode === 'edit'){
      var lock = getLock(selectedLockId);
      if(lock){
        var hit = raycastObjects(pointMarkerMeshes(lock));
        if(hit){
          pushUndoSnapshot();
          markerDrag = { lock: lock, index: hit.object.userData.pointIndex, refPoint: lock.points[hit.object.userData.pointIndex].clone() };
          return;
        }
      }
    }
  });

  viewportEl.addEventListener('pointermove', function(e){
    if(rollDrag){
      var dxM = e.clientX - rollDrag.centerPx.x, dyM = e.clientY - rollDrag.centerPx.y;
      var angle = Math.atan2(dyM, dxM);
      rollDrag.lock.roll = rollDrag.startRoll + (angle - rollDrag.startAngle);
      regenerateLockGeometry(rollDrag.lock);
      return;
    }
    if(singleHairDrag){
      setNdcFromEvent(e);
      var ptS = raycastPlaneThrough(singleHairDrag.refPoint);
      var deltaS = ptS.clone().sub(singleHairDrag.refPoint);
      if(detachHairRoot){
        singleHairDrag.seed.rootOffset.add(deltaS);
      } else {
        singleHairDrag.seed.subOffset.add(deltaS);
      }
      singleHairDrag.refPoint.copy(ptS);
      regenerateLockGeometry(singleHairDrag.lock);
      return;
    }
    if(brushDrag){
      setNdcFromEvent(e);
      var ptB = raycastPlaneThrough(brushDrag.refPoint);
      var delta = ptB.clone().sub(brushDrag.refPoint);
      brushDrag.affected.forEach(function(a){ a.seed.subOffset.addScaledVector(delta, a.weight); });
      brushDrag.refPoint.copy(ptB);
      brushCursor.position.copy(ptB);
      regenerateLockGeometry(brushDrag.lock);
      return;
    }
    if(markerDrag){
      setNdcFromEvent(e);
      var pt = magnetizedPoint(markerDrag.refPoint);
      markerDrag.lock.points[markerDrag.index].copy(pt);
      var mesh = markerDrag.lock.markerGroup.children.find(function(c){ return c.userData.pointIndex === markerDrag.index; });
      if(mesh) mesh.position.copy(pt);
      var guide = markerDrag.lock.markerGroup.children.find(function(c){ return c.userData.isGuideLine; });
      if(guide) guide.geometry.setFromPoints(markerDrag.lock.points);
      regenerateLockGeometry(markerDrag.lock);
      return;
    }
    if((activeBrush === 'move' || activeBrush === 'single') && !pointerDown){
      setNdcFromEvent(e);
      var lockH = getLock(selectedLockId);
      var hitH = lockH ? raycastObjects(lockH.group.children) : null;
      if(hitH){
        brushCursor.position.copy(hitH.point);
        brushCursor.scale.setScalar(activeBrush === 'single' ? 0.035 : brushRadius);
        brushCursor.visible = true;
      } else {
        brushCursor.visible = false;
      }
    }
    if(!pointerDown) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    if(Math.abs(e.clientX-startX) + Math.abs(e.clientY-startY) > 4) dragMoved = true;
    if(dragMoved){
      if(activeButton === 2 || e.shiftKey){
        var panSpeed = camState.radius * 0.0016;
        var forward = new THREE.Vector3(); camera.getWorldDirection(forward);
        var panRight = new THREE.Vector3().crossVectors(forward, camera.up).normalize();
        var panUp = new THREE.Vector3().crossVectors(panRight, forward).normalize();
        camState.target.addScaledVector(panRight, -dx*panSpeed);
        camState.target.addScaledVector(panUp, dy*panSpeed);
      } else {
        camState.azimuth -= dx * 0.0062;
        camState.polar = clampPolar(camState.polar - dy * 0.0062);
      }
      updateCamera();
    }
    lastX = e.clientX; lastY = e.clientY;
  });

  viewportEl.addEventListener('pointerup', function(e){
    if(rollDrag){
      rollDrag = null;
      pointerDown = false;
      return;
    }
    if(singleHairDrag){
      singleHairDrag = null;
      pointerDown = false;
      return;
    }
    if(brushDrag){
      brushDrag = null;
      pointerDown = false;
      return;
    }
    if(markerDrag){
      regenerateLockGeometry(markerDrag.lock);
      markerDrag = null;
      pointerDown = false;
      return;
    }
    if(pointerDown && !dragMoved){
      handleClick(e);
    }
    pointerDown = false;
  });

  viewportEl.addEventListener('pointerleave', function(){
    if(!brushDrag && !singleHairDrag) brushCursor.visible = false;
  });
  viewportEl.addEventListener('pointercancel', function(){
    rollDrag = null;
    brushDrag = null;
    markerDrag = null;
    singleHairDrag = null;
    pointerDown = false;
  });

  viewportEl.addEventListener('dblclick', function(e){
    if(mode !== 'edit') return;
    var lock = getLock(selectedLockId);
    if(!lock) return;
    setNdcFromEvent(e);
    var hit = raycastObjects(pointMarkerMeshes(lock));
    if(hit) deletePointFromLock(lock, hit.object.userData.pointIndex);
  });

  function handleClick(e){
    setNdcFromEvent(e);
    if(mode === 'add'){
      var point;
      if(draftPoints.length === 0){
        point = magnetizedPoint(camState.target);
      } else {
        point = magnetizedPoint(draftPoints[draftPoints.length-1]);
      }
      addDraftPoint(point);
    } else if(mode === 'view'){
      var hitLock = raycastObjects(allLockMeshes());
      if(hitLock) selectLock(hitLock.object.userData.lockId);
      else selectLock(null);
    } else if(mode === 'edit'){
      var sel = getLock(selectedLockId);
      if(sel){
        var hitInsert = raycastObjects(insertMarkerMeshes(sel));
        if(hitInsert){
          var afterIdx = hitInsert.object.userData.insertAfterIndex;
          var midPoint = sel.points[afterIdx].clone().lerp(sel.points[afterIdx+1], 0.5);
          insertPointIntoLock(sel, afterIdx, midPoint);
          return;
        }
        appendPointToLock(sel, magnetizedPoint(sel.points[sel.points.length-1]));
      } else {
        var hitLock2 = raycastObjects(allLockMeshes());
        if(hitLock2) selectLock(hitLock2.object.userData.lockId);
      }
    } else if(mode === 'trim'){
      var selT = getLock(selectedLockId);
      if(selT){
        var hitPt = raycastObjects(pointMarkerMeshes(selT));
        if(hitPt) trimLockAt(selT, hitPt.object.userData.pointIndex);
      } else {
        var hitLockT = raycastObjects(allLockMeshes());
        if(hitLockT) selectLock(hitLockT.object.userData.lockId);
      }
    }
  }

  /* ============================================================
     KEYBOARD
  ============================================================ */
  window.addEventListener('keydown', function(e){
    var tag = document.activeElement && document.activeElement.tagName;
    if(tag === 'INPUT' || tag === 'TEXTAREA') return;

    var ctrlOrCmd = e.ctrlKey || e.metaKey;
    if(ctrlOrCmd && !e.shiftKey && (e.key === 'z' || e.key === 'Z')){
      e.preventDefault();
      undo();
      return;
    }
    if(ctrlOrCmd && ((e.shiftKey && (e.key === 'z' || e.key === 'Z')) || e.key === 'y' || e.key === 'Y')){
      e.preventDefault();
      redo();
      return;
    }
    if(!ctrlOrCmd && (e.key === 'x' || e.key === 'X')){
      setSymmetryEnabled(!symmetryEnabled);
      return;
    }
    if(!ctrlOrCmd && (e.key === 'c' || e.key === 'C')){
      setMagnetEnabled(!magnetEnabled);
      return;
    }
    if(ctrlOrCmd && (e.key === 'd' || e.key === 'D')){
      e.preventDefault();
      var dupLock = getLock(selectedLockId);
      if(dupLock){ pushUndoSnapshot(); duplicateLock(dupLock); }
      return;
    }

    if(mode === 'add'){
      if(e.key === 'Enter') finishDraft();
      else if(e.key === 'Escape') clearDraft();
      else if(e.key === 'Backspace'){
        if(draftPoints.length){
          draftPoints.pop();
          var m = draftMarkerGroup.children.pop();
          if(m){ m.geometry.dispose(); m.material.dispose(); }
          refreshDraftLine();
          draftFinishBtn.disabled = draftPoints.length < 2;
          updateHint();
        }
      }
      return;
    }
    if((e.key === 'Delete' || e.key === 'Backspace') && selectedLockId){
      e.preventDefault();
      deleteLock(selectedLockId);
    }
    if(e.key === '1') setMode('view');
    if(e.key === '2') setMode('add');
    if(e.key === '3' && selectedLockId) setMode('edit');
    if(e.key === '4' && selectedLockId) setMode('trim');
    if(e.key === '5' && selectedLockId) setMode('rotate');
    if(e.key === 'Escape') selectLock(null);
  });

  /* ============================================================
     RESIZE + RENDER LOOP
  ============================================================ */
  window.addEventListener('resize', function(){
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  var polycountEl = document.getElementById('polycount');
  var lastPolycount = -1;
  function formatPolycount(n){
    if(n >= 1000) return t('polycount.thousands', {n: (n/1000).toFixed(1).replace(/\.0$/,'')});
    return t('polycount.under1k', {n: n});
  }
  function computeTotalTriangles(){
    var total = 0;
    locks.forEach(function(l){
      l.group.children.forEach(function(m){ if(m.geometry.index) total += m.geometry.index.count/3; });
    });
    return Math.round(total);
  }

  function animate(){
    requestAnimationFrame(animate);
    if(selectionRing.visible) selectionRing.lookAt(camera.position);
    if(brushCursor.visible) brushCursor.quaternion.copy(camera.quaternion);
    var tris = computeTotalTriangles();
    if(tris !== lastPolycount){
      lastPolycount = tris;
      polycountEl.textContent = formatPolycount(tris);
    }
    renderer.render(scene, camera);
  }
  animate();

  /* ============================================================
     INITIAL DEMO LOCK (so canvas isn't empty on first load)
  ============================================================ */
  loadEmbeddedDefaultHead();

  var demoLock = createLock([
    new THREE.Vector3(0.18, 0.62, 0.55),
    new THREE.Vector3(0.30, 0.15, 0.62),
    new THREE.Vector3(0.34, -0.45, 0.5),
    new THREE.Vector3(0.30, -0.95, 0.32)
  ]);
  setMode('view');
  selectLock(demoLock.id);

  /* ---------------- language switch ---------------- */
  function refreshAllUIText(){
    symmetryTextEl.textContent = t('indicator.symmetry.label') + ': ' + (symmetryEnabled ? t('state.on') : t('state.off'));
    magnetTextEl.textContent = t('indicator.magnet.label') + ': ' + (magnetEnabled ? t('state.on') : t('state.off'));
    directionTextEl.textContent = t('indicator.direction.label') + ': ' + (meshDirectionEnabled ? t('state.on') : t('state.off'));
    updateHint();
    renderSidebar();
    renderReferenceList();
    polycountEl.textContent = formatPolycount(lastPolycount < 0 ? 0 : lastPolycount);
  }
  onLangChange(refreshAllUIText);
  document.getElementById('lang-indicator').addEventListener('click', function(){
    setLang(LOKON_LANG === 'ru' ? 'en' : 'ru');
  });
  setLang(LOKON_LANG);

})();
</script>
</body>
</html>
