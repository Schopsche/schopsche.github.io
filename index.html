<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Локон — 3D-конструктор волос</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#131018;
    --bg-elevated:#1b1720;
    --bg-elevated-2:#221d29;
    --border:rgba(255,255,255,0.09);
    --text:#f3f0f8;
    --text-muted:#948da3;
    --text-dim:#635c72;
    --accent:#ff5da8;
    --accent-2:#8b6bff;
    --accent-soft:rgba(255,93,168,0.16);
    --danger:#ff6b6b;
    --radius:12px;
    --radius-sm:8px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  #app{position:fixed;inset:0;overflow:hidden;}
  #viewport{position:absolute;inset:0;z-index:0;cursor:grab;touch-action:none;}
  #viewport.mode-add{cursor:crosshair;}
  #viewport.mode-edit{cursor:default;}
  #viewport.mode-trim{cursor:crosshair;}
  #viewport.mode-brush{cursor:grab;}
  #viewport.mode-brush:active{cursor:grabbing;}
  #viewport:active{cursor:grabbing;}
  #viewport canvas{display:block;}

  /* ---------- topbar ---------- */
  #topbar{
    position:absolute;top:0;left:0;right:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;
    background:linear-gradient(to bottom, rgba(19,16,24,0.92) 0%, rgba(19,16,24,0.55) 70%, rgba(19,16,24,0) 100%);
    pointer-events:none;
  }
  #topbar > *{pointer-events:auto;}

  .toolbar{
    display:flex;align-items:center;gap:6px;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:999px;
    padding:5px;
  }
  .tool-btn{
    display:flex;align-items:center;gap:7px;
    background:transparent;border:none;color:var(--text-muted);
    font-family:'Inter',sans-serif;font-size:13px;font-weight:600;
    padding:9px 14px;border-radius:999px;cursor:pointer;
    transition:background .15s ease, color .15s ease;
    white-space:nowrap;
  }
  .tool-btn svg{width:16px;height:16px;flex:none;}
  .tool-btn:hover{color:var(--text);background:rgba(255,255,255,0.05);}
  .tool-btn.active{background:var(--accent);color:#1a0e14;}
  .tool-btn.danger-btn{color:var(--danger);}
  .tool-btn.danger-btn:hover{background:rgba(255,107,107,0.12);}
  .tool-btn:disabled{opacity:.35;cursor:not-allowed;}
  .tool-btn:disabled:hover{background:transparent;color:var(--text-muted);}
  .toolbar-sep{width:1px;height:20px;background:var(--border);margin:0 2px;}

  .header-actions{display:flex;align-items:center;gap:8px;}

  .export-btn{
    display:flex;align-items:center;gap:8px;
    background:var(--bg-elevated);border:1px solid var(--border);
    color:var(--text);font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
    padding:10px 16px;border-radius:999px;cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .export-btn svg{width:15px;height:15px;}
  .export-btn:hover{border-color:var(--accent);background:var(--accent-soft);}

  #toast{
    position:fixed;left:50%;bottom:78px;z-index:60;
    transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;
    background:var(--bg-elevated-2);border:1px solid var(--border);
    padding:11px 18px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--text);
    transition:opacity .2s ease, transform .2s ease;
    max-width:min(420px, calc(100vw - 40px));text-align:center;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast.error{border-color:rgba(255,107,107,0.45);color:#ffb8b8;}
  #toast.success{border-color:rgba(139,255,208,0.4);color:#bdf5e0;}

  #brushbar{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);
    z-index:20;display:flex;flex-direction:column;align-items:center;gap:6px;
    background:var(--bg-elevated);border:1px solid var(--border);
    border-radius:16px;padding:6px;
  }
  .brush-btn{
    width:42px;height:42px;flex:none;
    display:flex;align-items:center;justify-content:center;
    background:transparent;border:none;color:var(--text-muted);
    border-radius:12px;cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .brush-btn svg{width:19px;height:19px;}
  .brush-btn:hover{background:rgba(255,255,255,0.06);color:var(--text);}
  .brush-btn.active{background:var(--accent);color:#1a0e14;}
  .brush-options{
    display:none;flex-direction:column;gap:6px;
    padding:10px 8px 8px;width:120px;
    border-top:1px solid var(--border);margin-top:2px;
  }
  .brush-options.visible{display:flex;}
  .brush-options-label{font-size:10.5px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;text-align:center;}
  #brush-radius-slider{width:100%;}
  .brush-toggle-row{display:flex;align-items:center;justify-content:center;}
  .brush-toggle-row input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;}

  /* ---------- draft actions (add mode) ---------- */
  #draft-actions{
    position:absolute;left:50%;top:78px;transform:translateX(-50%);
    z-index:20;display:none;gap:8px;
  }
  #draft-actions.visible{display:flex;}
  .pill-btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
    padding:9px 16px;border-radius:999px;border:1px solid var(--border);
    background:var(--bg-elevated);color:var(--text);cursor:pointer;
  }
  .pill-btn.primary{background:var(--accent);color:#1a0e14;border-color:var(--accent);}
  .pill-btn.primary:disabled{opacity:.4;cursor:not-allowed;}

  /* ---------- hint bar ---------- */
  #hintbar{
    position:absolute;left:20px;bottom:18px;z-index:20;
    display:flex;align-items:center;gap:8px;
    background:rgba(27,23,32,0.85);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:9px 13px;
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;
    color:var(--text-muted);
    max-width:min(560px, calc(100vw - 340px));
    backdrop-filter:blur(6px);
  }
  #hintbar .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;}

  #symmetry-indicator, #magnet-indicator, #direction-indicator, #lang-indicator{
    position:absolute;left:20px;bottom:64px;z-index:20;
    display:flex;align-items:center;gap:7px;
    background:rgba(27,23,32,0.85);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:8px 12px;
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);
    cursor:pointer;backdrop-filter:blur(6px);
    transition:color .15s ease, border-color .15s ease;
  }
  #symmetry-indicator svg, #magnet-indicator svg, #direction-indicator svg, #lang-indicator svg{width:15px;height:15px;flex:none;}
  #symmetry-indicator:hover, #magnet-indicator:hover, #direction-indicator:hover, #lang-indicator:hover{border-color:var(--text-muted);color:var(--text);}
  #symmetry-indicator.on, #magnet-indicator.on, #direction-indicator.on{color:#7cf0a8;border-color:rgba(124,240,168,0.45);}
  #symmetry-indicator.on svg, #magnet-indicator.on svg, #direction-indicator.on svg{filter:drop-shadow(0 0 3px rgba(124,240,168,0.5));}
  #magnet-indicator{bottom:110px;}
  #direction-indicator{bottom:156px;}
  #lang-indicator{bottom:202px;}
  #lang-text{font-weight:600;letter-spacing:0.04em;}

  #polycount{
    position:absolute;right:324px;bottom:18px;z-index:20;
    background:rgba(27,23,32,0.85);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:9px 13px;
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-dim);
    backdrop-filter:blur(6px);pointer-events:none;user-select:none;
  }

  /* ---------- sidebar ---------- */
  #sidebar{
    position:absolute;top:0;right:0;bottom:0;width:308px;
    background:var(--bg-elevated);
    border-left:1px solid var(--border);
    z-index:15;
    display:flex;flex-direction:column;
    padding-top:84px;
  }
  #sidebar-scroll{flex:1;overflow-y:auto;padding:0 16px 20px;}
  #sidebar-scroll::-webkit-scrollbar{width:8px;}
  #sidebar-scroll::-webkit-scrollbar-thumb{background:var(--bg-elevated-2);border-radius:4px;}

  .side-heading{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12px;
    letter-spacing:0.08em;text-transform:uppercase;color:var(--text-dim);
    margin:4px 0 10px;
  }

  #lock-list{list-style:none;margin:0 0 22px;padding:0;display:flex;flex-direction:column;gap:4px;}
  .lock-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 10px;border-radius:var(--radius-sm);cursor:pointer;
    border:1px solid transparent;
    transition:background .12s ease, border-color .12s ease;
  }
  .lock-item:hover{background:rgba(255,255,255,0.04);}
  .lock-item.selected{background:var(--accent-soft);border-color:rgba(255,93,168,0.35);}
  .lock-swatch{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,0.08);}
  .lock-item-name{font-size:13.5px;font-weight:500;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lock-item-count{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-dim);}
  .mirror-badge{
    flex:none;width:20px;height:20px;padding:0;margin-left:2px;
    display:flex;align-items:center;justify-content:center;
    background:transparent;border:none;color:var(--text-dim);cursor:pointer;border-radius:50%;
  }
  .mirror-badge svg{width:13px;height:13px;}
  .mirror-badge:hover{color:var(--text-muted);background:rgba(255,255,255,0.06);}
  .mirror-badge.linked{color:#7cf0a8;}
  .mirror-badge.linked svg{filter:drop-shadow(0 0 2px rgba(124,240,168,0.6));}
  .mirror-badge.linked circle{fill:#7cf0a8;fill-opacity:0.25;}

  .empty-state{
    padding:26px 14px;text-align:center;border:1px dashed var(--border);border-radius:var(--radius);
  }
  .empty-state svg{width:30px;height:30px;color:var(--text-dim);margin-bottom:10px;}
  .empty-state p{margin:0;font-size:12.5px;color:var(--text-muted);line-height:1.5;}

  .prop-block{border-top:1px solid var(--border);padding-top:18px;}
  .prop-name-row{display:flex;align-items:center;gap:9px;margin-bottom:16px;}
  .prop-type-row{display:flex;align-items:center;justify-content:space-between;gap:9px;margin:-8px 0 16px;}
  .prop-type-row .field-label{flex:none;}
  .hair-type-select{
    background:var(--bg-elevated-2);border:1px solid var(--border);color:var(--text);
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:500;
    border-radius:var(--radius-sm);padding:7px 9px;cursor:pointer;
    max-width:150px;
  }
  .hair-type-select:focus{outline:none;border-color:var(--accent);}
  .split-toggle-row{margin-bottom:14px;}
  .split-toggle{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;}
  .prop-name-input{
    flex:1;background:var(--bg-elevated-2);border:1px solid var(--border);
    color:var(--text);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;
    border-radius:var(--radius-sm);padding:9px 10px;min-width:0;
  }
  .prop-name-input:focus{outline:none;border-color:var(--accent);}
  .color-swatch-input{
    width:34px;height:34px;border-radius:9px;border:1px solid var(--border);
    padding:0;background:none;cursor:pointer;flex:none;
  }
  .field{margin-bottom:16px;}
  .field-label-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;}
  .field-label{font-size:12px;color:var(--text-muted);font-weight:500;}
  .field-value{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--accent);}
  input[type=range]{
    -webkit-appearance:none;width:100%;height:4px;border-radius:2px;
    background:var(--bg-elevated-2);outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:var(--accent);cursor:pointer;border:2px solid #1a0e14;
    box-shadow:0 0 0 1px rgba(255,93,168,0.4);
  }
  input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border-radius:50%;background:var(--accent);
    cursor:pointer;border:2px solid #1a0e14;
  }
  .curve-editor-svg{
    width:100%;height:100px;display:block;
    background:var(--bg-elevated-2);border:1px solid var(--border);
    border-radius:var(--radius-sm);touch-action:none;cursor:crosshair;
  }
  .curve-grid{stroke:rgba(255,255,255,0.07);stroke-width:1;}
  .curve-grid-ref{stroke:rgba(255,255,255,0.16);stroke-width:1;stroke-dasharray:3,3;}
  .curve-path{fill:none;stroke:var(--accent);stroke-width:2;}
  .curve-point{fill:var(--bg-elevated);stroke:var(--accent);stroke-width:2;cursor:pointer;}
  .curve-point.endpoint{fill:var(--accent);}
  .curve-point.selected{stroke:#fff;stroke-width:2.5;}
  .curve-handle-line{stroke:var(--accent-2);stroke-width:1.5;stroke-dasharray:2,2;}
  .curve-handle-dot{fill:var(--accent-2);stroke:var(--bg-elevated);stroke-width:1.5;cursor:pointer;}
  .curve-type-row{
    display:none;gap:4px;margin-top:6px;
  }
  .curve-type-row.visible{display:flex;}
  .curve-type-btn{
    flex:1;background:var(--bg-elevated-2);border:1px solid var(--border);color:var(--text-muted);
    font-family:'IBM Plex Mono',monospace;font-size:10px;padding:6px 4px;border-radius:6px;cursor:pointer;
  }
  .curve-type-btn:hover{color:var(--text);border-color:var(--accent);}
  .curve-type-btn.active{background:var(--accent);color:#1a0e14;border-color:var(--accent);font-weight:600;}
  .cuts-editor-svg{
    width:100%;height:44px;display:block;
    background:var(--bg-elevated-2);border:1px solid var(--border);
    border-radius:var(--radius-sm);touch-action:none;cursor:crosshair;
  }
  .cuts-editor-2d{height:130px;}
  .cuts-axis-label{fill:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-size:8px;}
  .cuts-bar{fill:rgba(255,255,255,0.08);stroke:var(--border);stroke-width:1;}
  .cut-point{fill:var(--accent-2);stroke:var(--bg-elevated);stroke-width:2;cursor:pointer;}
  .curve-reset-btn{
    background:transparent;border:1px solid var(--border);color:var(--text-muted);
    font-size:10.5px;padding:3px 9px;border-radius:999px;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;
  }
  .curve-reset-btn:hover{color:var(--text);border-color:var(--accent);}
  .curve-hint{font-size:10.5px;color:var(--text-dim);margin-top:5px;line-height:1.4;}
  .delete-lock-btn{
    width:100%;margin-top:6px;
    display:flex;align-items:center;justify-content:center;gap:7px;
    padding:10px;border-radius:var(--radius-sm);
    background:transparent;border:1px solid rgba(255,107,107,0.3);
    color:var(--danger);font-family:'Inter',sans-serif;font-weight:600;font-size:12.5px;
    cursor:pointer;transition:background .15s ease;
  }
  .delete-lock-btn:hover{background:rgba(255,107,107,0.1);}
  .delete-lock-btn svg{width:14px;height:14px;}

  /* ---------- responsive ---------- */
  @media (max-width:760px){
    #sidebar{
      top:auto;left:0;right:0;bottom:0;width:auto;height:46vh;
      border-left:none;border-top:1px solid var(--border);
      border-radius:18px 18px 0 0;padding-top:14px;
    }
    #topbar{padding:12px;}
    .tool-btn span{display:none;}
    .tool-btn{padding:10px;}
    .export-btn span{display:none;}
    .export-btn{padding:10px;}
    .header-actions{flex-wrap:wrap;justify-content:flex-end;gap:6px;}
    #hintbar{max-width:calc(100vw - 40px);bottom:calc(46vh + 14px);}
    #draft-actions{top:auto;bottom:calc(46vh + 14px);}
    #polycount{right:12px;bottom:calc(46vh + 14px);}
    #symmetry-indicator{bottom:calc(46vh + 60px);}
    #magnet-indicator{bottom:calc(46vh + 106px);}
    #direction-indicator{bottom:calc(46vh + 152px);}
    #lang-indicator{bottom:calc(46vh + 198px);}
    #brushbar{left:8px;}
    .brush-btn{width:38px;height:38px;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="viewport"></div>

  <header id="topbar">
    <div class="toolbar" id="toolbar">
      <button class="tool-btn" data-mode="view" title="Обзор (1)" data-i18n-title="tool.view.title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l5.5 15 2-6.2L19 9.5 5 3z"/></svg>
        <span data-i18n="tool.view.label">Обзор</span>
      </button>
      <button class="tool-btn" data-mode="add" title="Новая прядь (2)" data-i18n-title="tool.add.title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18c3-8 6-11 8-11s2 4 4 4 3-3 5-2"/><circle cx="4" cy="18" r="1.6" fill="currentColor" stroke="none"/></svg>
        <span data-i18n="tool.add.label">Прядь</span>
      </button>
      <button class="tool-btn" data-mode="edit" title="Редактировать точки (3)" data-i18n-title="tool.edit.title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="2"/><circle cx="18" cy="7" r="2"/><path d="M7.6 15.6L16.4 8.4"/></svg>
        <span data-i18n="tool.edit.label">Точки</span>
      </button>
      <button class="tool-btn" data-mode="trim" title="Обрезать прядь (4)" data-i18n-title="tool.trim.title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.3"/><circle cx="6" cy="18" r="2.3"/><path d="M8.3 7.5L19 17M8.3 16.5L19 7"/></svg>
        <span data-i18n="tool.trim.label">Обрезка</span>
      </button>
      <button class="tool-btn" data-mode="rotate" title="Вращать прядь (5)" data-i18n-title="tool.rotate.title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0114-5.2M20 12a8 8 0 01-14 5.2"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>
        <span data-i18n="tool.rotate.label">Вращение</span>
      </button>
      <div class="toolbar-sep"></div>
      <button class="tool-btn" id="duplicate-btn" title="Дублировать прядь (Ctrl+D)" data-i18n-title="tool.duplicate.title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="1.5"/><path d="M4 16V5a1 1 0 011-1h11"/></svg>
      </button>
      <button class="tool-btn" id="mirror-btn" title="Отзеркалить прядь (X-парой)" data-i18n-title="tool.mirror.title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M5 8l4 4-4 4M19 8l-4 4 4 4"/></svg>
      </button>
      <button class="tool-btn danger-btn" id="delete-btn" title="Удалить прядь (Delete)" data-i18n-title="tool.delete.title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2m-8 0l1 12a1 1 0 001 1h6a1 1 0 001-1l1-12"/></svg>
      </button>
    </div>

    <div class="header-actions">
      <button class="export-btn" id="import-head-btn" title="Импортировать голову из FBX или OBJ" data-i18n-title="btn.importHead.title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9m0 0l-4 4m4-4l4 4M5 5h14"/></svg>
        <span data-i18n="btn.importHead.label">Голова</span>
      </button>
      <input type="file" id="fbx-file-input" accept=".fbx,.obj" style="display:none;">

      <button class="export-btn" id="import-ref-btn" title="Импортировать референс-объекты (можно несколько сразу)" data-i18n-title="btn.importRef.title">

          if(polygon.length === 3){
            indices.push(vertOffset+polygon[0], vertOffset+polygon[1], vertOffset+polygon[2]);
          } else if(polygon.length > 3){
            var polyPts = polygon.map(function(pidx){ return localPts[pidx]; });
            var tris = triangulatePolygonLocal(polyPts);
            tris.forEach(function(t){
              indices.push(vertOffset+polygon[t[0]], vertOffset+polygon[t[1]], vertOffset+polygon[t[2]]);
            });
          }
          polygon = [];
        }
      }
      vertOffset += nv;
    });
    return { positions: new Float32Array(positions), indices: new Uint32Array(indices) };
  }

  function importFBX(bufferOrText){
    var tree;
    if(typeof bufferOrText === 'string'){
      tree = readAscii(bufferOrText);
    } else {
      tree = readBinary(bufferOrText);
      if(!tree){
        var text = new TextDecoder('utf-8').decode(new Uint8Array(bufferOrText));
        tree = readAscii(text);
      }
    }
    var meshes = extractMeshes(tree);
    if(!meshes.length) throw new Error(t('error.noMeshesInFbx'));
    return triangulateAndMerge(meshes);
  }

  /* OBJ is a plain-text, unambiguous format (unlike FBX's binary encoding) —
     offered as a reliable fallback for both import and export. */
  function importOBJ(text){
    var positions = [];
    var indices = [];
    var lines = text.split(/\r?\n/);
    for(var i=0;i<lines.length;i++){
      var line = lines[i].trim();
      if(line.length===0 || line[0]==='#') continue;
      var parts = line.split(/\s+/);
      var tag = parts[0];
      if(tag === 'v'){
        positions.push(parseFloat(parts[1])||0, parseFloat(parts[2])||0, parseFloat(parts[3])||0);
      } else if(tag === 'f'){
        var faceVerts = [];
        for(var k=1;k<parts.length;k++){
          var vRef = parts[k].split('/')[0];
          var vi = parseInt(vRef,10);
          if(!vi) continue;
          if(vi < 0) vi = (positions.length/3) + vi + 1;
          faceVerts.push(vi-1);
        }
        if(faceVerts.length === 3){
          indices.push(faceVerts[0], faceVerts[1], faceVerts[2]);
        } else if(faceVerts.length > 3){
          var polyPts = faceVerts.map(function(vidx){ return [positions[vidx*3],positions[vidx*3+1],positions[vidx*3+2]]; });
          var tris = triangulatePolygonLocal(polyPts);
          tris.forEach(function(t){ indices.push(faceVerts[t[0]], faceVerts[t[1]], faceVerts[t[2]]); });
        }
      }
    }
    if(!indices.length) throw new Error(t('error.noFacesInObj'));
    return { positions: new Float32Array(positions), indices: new Uint32Array(indices) };
  }

  return { readBinary: readBinary, readAscii: readAscii, extractMeshes: extractMeshes, triangulateAndMerge: triangulateAndMerge, importFBX: importFBX, importOBJ: importOBJ };
});

/* ---- LokonFBXExport (ascii FBX writer) ---- */
(function(root, factory){
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.LokonFBXExport = factory();
})(typeof self !== 'undefined' ? self : this, function(){
  "use strict";

  function hexToRgb01(hex){
    var h = String(hex).replace('#','');
    var r = parseInt(h.substring(0,2),16)/255;
    var g = parseInt(h.substring(2,4),16)/255;
    var b = parseInt(h.substring(4,6),16)/255;
    return [r,g,b];
  }
  function fmtNum(n){
    if(Object.is(n,-0)) n = 0;
    return n.toFixed(6);
  }
  /* =====================================================================
     OBJ WRITER (plain text, no binary encoding ambiguity — most reliable
     option for getting geometry into Maya/Blender/anything else)
  ===================================================================== */
  function sanitizeObjName(name){
    return String(name).replace(/\s+/g,'_').replace(/[^\w-]/g,'') || 'Lock';
  }

  function exportMeshesToOBJ(meshesData, mtlFilename){
    var objLines = ['# Lokon hair export', 'mtllib ' + mtlFilename, ''];
    var mtlLines = [];
    var vertOffset = 0;
    var usedNames = {};

    meshesData.forEach(function(mesh){
      var base = sanitizeObjName(mesh.name);
      var name = base;
      var n2 = 1;
      while(usedNames[name]){ name = base + '_' + (++n2); }
      usedNames[name] = true;

      var positions = mesh.positions, quads = mesh.quads, uvArr = mesh.uvs;
      var nv = positions.length/3;

      objLines.push('g ' + name);
      objLines.push('usemtl ' + name);
      for(var i=0;i<nv;i++){
        objLines.push('v ' + fmtNum(positions[i*3]) + ' ' + fmtNum(positions[i*3+1]) + ' ' + fmtNum(positions[i*3+2]));
      }
      for(i=0;i<nv;i++){
        objLines.push('vt ' + fmtNum(uvArr[i*2]) + ' ' + fmtNum(uvArr[i*2+1]));
      }
      quads.forEach(function(qd){
        var parts = qd.map(function(idx){ var g = vertOffset+idx+1; return g+'/'+g; });
        objLines.push('f ' + parts.join(' '));
      });
      objLines.push('');
      vertOffset += nv;

      var rgb = hexToRgb01(mesh.color || '#ffffff');
      mtlLines.push('newmtl ' + name);
      mtlLines.push('Kd ' + fmtNum(rgb[0]) + ' ' + fmtNum(rgb[1]) + ' ' + fmtNum(rgb[2]));
      mtlLines.push('Ka 0.050000 0.050000 0.050000');
      mtlLines.push('Ks 0.040000 0.040000 0.040000');
      mtlLines.push('d 1.000000');
      mtlLines.push('illum 2');
      mtlLines.push('');
    });

    return { obj: objLines.join('\n'), mtl: mtlLines.join('\n') };
  }

  return {
    exportMeshesToOBJ: exportMeshesToOBJ
  };
});

<script>
(function(){
  "use strict";

  /* ============================================================
     SCENE SETUP
  ============================================================ */
  var viewportEl = document.getElementById('viewport');
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x131018);
  scene.fog = null;

  var camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.05, 100);

  var renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  viewportEl.appendChild(renderer.domElement);

  // lights
  scene.add(new THREE.AmbientLight(0x8b859a, 1.05));
  var keyLight = new THREE.DirectionalLight(0xfff2ec, 0.85);
  keyLight.position.set(2.4, 3, 2.2);
  scene.add(keyLight);
  var fillLight = new THREE.DirectionalLight(0x9fc4ff, 0.55);
  fillLight.position.set(-2.6, 1, -1.6);
  scene.add(fillLight);
  var rimLight = new THREE.DirectionalLight(0xff9fd4, 0.28);
  rimLight.position.set(0, 1.5, -3);
  scene.add(rimLight);

  // head reference mesh (also the raycast target for root points)
  var headMesh = (function(){
    var geo = new THREE.SphereGeometry(0.86, 40, 32);
    var mat = new THREE.MeshStandardMaterial({
      color:0x8c8494, transparent:true, opacity:0.4,
      roughness:0.7, metalness:0.02, side:THREE.DoubleSide
    });
    var mesh = new THREE.Mesh(geo, mat);
    mesh.scale.set(0.86, 1.08, 0.95);
    mesh.position.set(0,0,0);
    scene.add(mesh);
    return mesh;
  })();

  // Replace the head mesh geometry with an imported one, normalized (centered + scaled)
  // to the tool's working volume so hair-root raycasting and camera framing keep working.
  function applyImportedHeadGeometry(positions, indices){
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setIndex(new THREE.BufferAttribute(indices, 1));
    geo.computeBoundingSphere();
    var bs = geo.boundingSphere;
    var radius = (bs && bs.radius) ? bs.radius : 1;
    var scaleFactor = 0.92 / radius;
    var cx = bs ? bs.center.x : 0, cy = bs ? bs.center.y : 0, cz = bs ? bs.center.z : 0;
    geo.translate(-cx, -cy, -cz);
    geo.scale(scaleFactor, scaleFactor, scaleFactor);
    geo.computeVertexNormals();

    headMesh.geometry.dispose();
    headMesh.geometry = geo;
    headMesh.scale.set(1,1,1);
    headMesh.position.set(0,0,0);
    headMesh.material.color.set(0xcfc6bd);
    headMesh.material.opacity = 1;
    headMesh.material.transparent = false;
    headMesh.material.roughness = 0.85;
    headMesh.material.needsUpdate = true;
  }

  /* ---------------- reference objects: extra imported meshes, purely visual,
     positionable in the scene (not raycast targets for magnetizing hair) ---------------- */
  var referenceObjects = [];
  var refCounter = 0;
  var selectedRefId = null;

  function normalizedRefGeometry(positions, indices){
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setIndex(new THREE.BufferAttribute(indices, 1));
    geo.computeBoundingSphere();
    var bs = geo.boundingSphere;
    var radius = (bs && bs.radius) ? bs.radius : 1;
    var scaleFactor = 0.92 / radius;
    var cx = bs ? bs.center.x : 0, cy = bs ? bs.center.y : 0, cz = bs ? bs.center.z : 0;
    geo.translate(-cx, -cy, -cz);
    geo.scale(scaleFactor, scaleFactor, scaleFactor);
    geo.computeVertexNormals();
    return geo;
  }

  // Creates a new reference object mesh from parsed geometry, or (when `existingId`/`transform`
  // are given, e.g. on project load) re-attaches it under a specific saved id and transform.
  function addReferenceObject(positions, indices, filename, existingId, transform){
    var geo = normalizedRefGeometry(positions, indices);
    var mat = new THREE.MeshStandardMaterial({
      color: 0x8ea6c2, roughness: 0.85, metalness: 0.02, side: THREE.DoubleSide
    });
    var mesh = new THREE.Mesh(geo, mat);
    if(transform){
      mesh.position.set(transform.position[0], transform.position[1], transform.position[2]);
      mesh.rotation.set(transform.rotation[0], transform.rotation[1], transform.rotation[2]);
      mesh.scale.set(transform.scale[0], transform.scale[1], transform.scale[2]);
    } else {
      mesh.position.set(0, 0, 0);
    }
    scene.add(mesh);
    refCounter++;
    var refObj = { id: existingId || ('ref_'+Date.now()+'_'+refCounter), name: filename, mesh: mesh };
    referenceObjects.push(refObj);
    renderReferenceList();
    return refObj;
  }

  function deleteReferenceObject(id){
    var ref = referenceObjects.find(function(r){ return r.id === id; });
    if(!ref) return;
    scene.remove(ref.mesh);
    ref.mesh.geometry.dispose();
    ref.mesh.material.dispose();
    referenceObjects = referenceObjects.filter(function(r){ return r.id !== id; });
    if(selectedRefId === id) selectedRefId = null;
    renderReferenceList();
  }

  // Decode the embedded default reference head: u32 vertCount, u32 triCount, f32[] positions, u16[] indices
  function loadEmbeddedDefaultHead(){
    if(!window.LOKON_DEFAULT_HEAD_B64) return false;
    try{
      var binStr = atob(window.LOKON_DEFAULT_HEAD_B64);
      var bytes = new Uint8Array(binStr.length);
      for(var i=0;i<binStr.length;i++) bytes[i] = binStr.charCodeAt(i);
      var dv = new DataView(bytes.buffer);
      var vertCount = dv.getUint32(0, true);
      var triCount = dv.getUint32(4, true);
      var off = 8;
      var positions = new Float32Array(vertCount*3);
      for(var p=0;p<vertCount*3;p++){ positions[p] = dv.getFloat32(off, true); off += 4; }
      var indices = new Uint32Array(triCount*3);
      for(var idx=0;idx<triCount*3;idx++){ indices[idx] = dv.getUint16(off, true); off += 2; }
      applyImportedHeadGeometry(positions, indices);
      return true;
    } catch(err){
      console.warn('Не удалось загрузить встроенный референс головы:', err);
      return false;
    }
  }

  // Generic compact mesh packer used by project save/load (u32 indices, unlike the embedded
  // default head's u16 format, so it stays correct for larger imported reference meshes too).
  function packMeshToB64(positions, indices){
    var vertCount = positions.length/3;
    var triCount = indices.length/3;
    var buf = new ArrayBuffer(8 + vertCount*3*4 + triCount*3*4);
    var dv = new DataView(buf);
    dv.setUint32(0, vertCount, true);
    dv.setUint32(4, triCount, true);
    var off = 8;
    for(var i=0;i<positions.length;i++){ dv.setFloat32(off, positions[i], true); off += 4; }
    for(var j=0;j<indices.length;j++){ dv.setUint32(off, indices[j], true); off += 4; }
    var bytes = new Uint8Array(buf);
    var binStr = '', chunk = 0x8000;
    for(var k=0;k<bytes.length;k+=chunk){
      binStr += String.fromCharCode.apply(null, bytes.subarray(k, Math.min(k+chunk, bytes.length)));
    }
    return btoa(binStr);

    var binStr = atob(b64);
    var bytes = new Uint8Array(binStr.length);
    for(var i=0;i<binStr.length;i++) bytes[i] = binStr.charCodeAt(i);
    var dv = new DataView(bytes.buffer);
    var vertCount = dv.getUint32(0, true);
    var triCount = dv.getUint32(4, true);
    var off = 8;
    var positions = new Float32Array(vertCount*3);
    for(var p=0;p<vertCount*3;p++){ positions[p] = dv.getFloat32(off, true); off += 4; }
    var indices = new Uint32Array(triCount*3);
    for(var idx=0;idx<triCount*3;idx++){ indices[idx] = dv.getUint32(off, true); off += 4; }

  /* ============================================================
     STRAND GEOMETRY
     Each strand is a thin, tapering, flattened tube (real 3D volume,
     not a zero-thickness plane), built as QUAD topology (side walls +
     2 quad end caps, no triangles) with a straightened cylindrical UV
     (u = around the tube, v = along its length) so it unwraps cleanly
     in any DCC tool. For live WebGL preview each quad is split into 2
     triangles (WebGL can't render quads directly); the untriangulated
     quad list is kept alongside for export.

     The cross-section frame is anchored to the head's outward surface
     direction at the root (so hair grows away from the head, not into
     it) and then parallel-transported along the curve using the
     minimal rotation between consecutive tangents, avoiding the
     twisting/flipping artifacts of recomputing an arbitrary reference
     frame independently at every point.
  ============================================================ */
  var CROSS_U = [1, -1, -1, 1];
  var CROSS_V = [1, 1, -1, -1];
  var RING = 4;

  function initialFrame(tangent, rootNormal){
    var n0 = rootNormal.clone();
    n0.sub(tangent.clone().multiplyScalar(n0.dot(tangent))); // project out any tangent component
    if(n0.lengthSq() < 1e-6){
      var fallbackUp = Math.abs(tangent.y) > 0.95 ? new THREE.Vector3(1,0,0) : new THREE.Vector3(0,1,0);
      n0.crossVectors(tangent, fallbackUp).cross(tangent);
    }
    n0.normalize();
    var b0 = new THREE.Vector3().crossVectors(tangent, n0).normalize();
    n0.crossVectors(b0, tangent).normalize(); // re-orthogonalize for a clean right-handed frame
    return { normal: n0, binormal: b0 };
  }

  /* ---- Thickness profile curve: root-to-tip multiplier, user-editable ---- */
  function defaultThicknessCurve(){
    return [{t:0, v:1, type:'spline'}, {t:0.5, v:0.64, type:'spline'}, {t:1, v:0, type:'spline'}];
  }

  /* ---- Hair types: presets that set a starting thickness profile plus sensible
         starting parameters. Add new entries here to grow the list over time. ---- */
  var HAIR_TYPES = {
    natural: {
      get label(){ return t('hairType.natural'); },
      curve: function(){ return defaultThicknessCurve(); },
      defaults: { density: 6, spread: 0.3, lengthVariation: 0.22, waviness: 0.2, depth: 0.022 }
    },
    blunt: {
      get label(){ return t('hairType.blunt'); },
      curve: function(){ return [{t:0,v:1,type:'spline'},{t:0.88,v:0.94,type:'spline'},{t:1,v:0.88,type:'spline'}]; },
      defaults: { density: 1, spread: 0, lengthVariation: 0, waviness: 0, depth: 0.007 }
    }
  };
  var HAIR_TYPE_ORDER = ['natural', 'blunt'];
  var CURVE_POINT_TYPES = ['spline', 'linear'];
  function curvePointTypeLabel(key){ return t('curveType.'+key); }

  function bezierEval(p0, p1, p2, p3, u){
    var mu = 1-u;
    return mu*mu*mu*p0 + 3*mu*mu*u*p1 + 3*mu*u*u*p2 + u*u*u*p3;
  }
  // Bisect for the Bezier parameter u whose T-component equals targetT. Handle T-offsets are
  // always clamped >= 0 by the editor, so the T-component is guaranteed monotonic in u.
  function solveBezierU(t0, t1, t2, t3, targetT){
    if(targetT <= t0) return 0;
    if(targetT >= t3) return 1;
    var lo = 0, hi = 1;
    for(var i=0;i<20;i++){
      var mid = (lo+hi)/2;
      if(bezierEval(t0,t1,t2,t3,mid) < targetT) lo = mid; else hi = mid;
    }
    return (lo+hi)/2;
  }
  // Catmull-Rom-style auto tangent, used whenever a point doesn't have an explicit
  // (user-dragged) handle -- keeps new/undragged points smooth without extra setup.
  function autoHandle(curve, idx){
    var p = curve[idx];
    var prev = curve[idx-1], next = curve[idx+1];
    var leftSpan = prev ? (p.t - prev.t) : null;
    var rightSpan = next ? (next.t - p.t) : null;
    var refSpan = Math.min(leftSpan != null ? leftSpan : (rightSpan || 0.2), rightSpan != null ? rightSpan : (leftSpan || 0.2));
    var slope;
    if(prev && next) slope = (next.v - prev.v) / Math.max(1e-4, next.t - prev.t);
    else if(next) slope = (next.v - p.v) / Math.max(1e-4, next.t - p.t);
    else if(prev) slope = (p.v - prev.v) / Math.max(1e-4, p.t - prev.t);
    else slope = 0;
    var dt = refSpan * 0.4;
    return { dt: dt, dv: slope * dt };

  function getPointHandle(curve, idx){
    var p = curve[idx];
    if(p.handleDt != null) return { dt: p.handleDt, dv: p.handleDv };
    return autoHandle(curve, idx);

  // `a.type` governs how the segment FROM point a TO the next point is interpolated
  // (matches Maya's per-key tangent convention): spline = cubic Bezier through each point's
  // in/out tangent handles, linear = straight line.
  function sampleThicknessCurve(curve, t){
    if(!curve || !curve.length) return 1 - t;
    if(t <= curve[0].t) return curve[0].v;
    if(t >= curve[curve.length-1].t) return curve[curve.length-1].v;
    for(var i=0;i<curve.length-1;i++){
      var a = curve[i], b = curve[i+1];
      if(t >= a.t && t <= b.t){
        var span = b.t - a.t;
        var localT = span > 1e-6 ? (t-a.t)/span : 0;
        var type = a.type || 'spline';
        if(type === 'linear') return a.v + (b.v-a.v)*localT;
        var outH = getPointHandle(curve, i);
        var inH = getPointHandle(curve, i+1);
        var p1t = a.t+outH.dt, p1v = a.v+outH.dv;
        var p2t = b.t-inH.dt, p2v = b.v-inH.dv;
        var u = solveBezierU(a.t, p1t, p2t, b.t, t);
        return bezierEval(a.v, p1v, p2v, b.v, u);

    }
    return curve[curve.length-1].v;
  }

  // Draggable SVG graph: X = position along the strand (root..tip), Y = thickness multiplier.
  // Click empty space to add a point, drag points to reshape, double-click a middle point to remove it,
  // click (without dragging) an existing point to select it and choose its interpolation type below
  // (Spline/Linear/Step -- like tangent types in Maya's Graph Editor). The type set on a point governs
  // how the segment FROM that point TO the next one is interpolated.
  function buildThicknessCurveEditor(lock, wrap){
    var W = 260, H = 100, PAD = 10, VMAX = 1.5;
    function gx(t){ return PAD + t*(W-2*PAD); }
    function gy(v){ return PAD + (1 - v/VMAX)*(H-2*PAD); }
    function invX(px){ return Math.min(1, Math.max(0, (px-PAD)/(W-2*PAD))); }
    function invY(py){ return Math.min(VMAX, Math.max(0, (1-(py-PAD)/(H-2*PAD))*VMAX)); }

    var field = document.createElement('div'); field.className = 'field';
    var row = document.createElement('div'); row.className = 'field-label-row';
    var label = document.createElement('span'); label.className = 'field-label'; label.textContent = t('field.thicknessProfile');
    var resetBtn = document.createElement('button'); resetBtn.className = 'curve-reset-btn'; resetBtn.textContent = t('action.reset');
    row.appendChild(label); row.appendChild(resetBtn);
    field.appendChild(row);

    var svgNS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('class', 'curve-editor-svg');

    var grid = document.createElementNS(svgNS, 'g');
    [0, 0.5, 1, 1.5].forEach(function(v){
      var ln = document.createElementNS(svgNS, 'line');
      ln.setAttribute('x1', gx(0)); ln.setAttribute('x2', gx(1));
      ln.setAttribute('y1', gy(v)); ln.setAttribute('y2', gy(v));
      ln.setAttribute('class', v === 1 ? 'curve-grid-ref' : 'curve-grid');
      grid.appendChild(ln);
    });
    svg.appendChild(grid);

    var path = document.createElementNS(svgNS, 'path');
    path.setAttribute('class', 'curve-path');
    svg.appendChild(path);

    var handlesLayer = document.createElementNS(svgNS, 'g');
    svg.appendChild(handlesLayer);

    var pointsLayer = document.createElementNS(svgNS, 'g');
    svg.appendChild(pointsLayer);

    if(!lock.thicknessCurve || lock.thicknessCurve.length < 2) lock.thicknessCurve = defaultThicknessCurve();
    lock.thicknessCurve.forEach(function(pt){ if(!pt.type) pt.type = 'spline'; }); // backward-compat

    var selectedPoint = null;

    var typeRow = document.createElement('div'); typeRow.className = 'curve-type-row';
    var typeButtons = {};
    CURVE_POINT_TYPES.forEach(function(typeKey){
      var btn = document.createElement('button');
      btn.className = 'curve-type-btn';
      btn.textContent = curvePointTypeLabel(typeKey);
      btn.addEventListener('click', function(){
        if(!selectedPoint) return;
        pushUndoSnapshot();
        selectedPoint.type = typeKey;
        regenerateLockGeometry(lock);
        redrawPath(); redrawPoints(); redrawHandles(); updateTypeRow();
      });
      typeRow.appendChild(btn);
      typeButtons[typeKey] = btn;
    });

    function updateTypeRow(){
      typeRow.classList.toggle('visible', !!selectedPoint);
      CURVE_POINT_TYPES.forEach(function(typeKey){
        typeButtons[typeKey].classList.toggle('active', !!selectedPoint && (selectedPoint.type||'spline') === typeKey);
      });
    }

    function redrawPath(){
      var curve = lock.thicknessCurve;
      var d = '';
      var STEPS = 48;
      for(var i=0;i<=STEPS;i++){
        var t = i/STEPS;
        var v = sampleThicknessCurve(curve, t);
        var x = gx(t), y = gy(v);
        d += (i===0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
      }
      path.setAttribute('d', d);
    }
    function pointShapeMarkup(pt, isSelected, isEndpoint){
      var type = pt.type || 'spline';
      var cx = gx(pt.t), cy = gy(pt.v);
      var cls = 'curve-point curve-point-' + type + (isEndpoint ? ' endpoint' : '') + (isSelected ? ' selected' : '');
      if(type === 'linear'){
        var s = 5;
        var rect = document.createElementNS(svgNS, 'rect');
        rect.setAttribute('x', cx-s); rect.setAttribute('y', cy-s);
        rect.setAttribute('width', s*2); rect.setAttribute('height', s*2);
        rect.setAttribute('class', cls);
        return rect;
      }
      var c = document.createElementNS(svgNS, 'circle');
      c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', 5);
      c.setAttribute('class', cls);
      return c;
    }
    function redrawPoints(){
      while(pointsLayer.firstChild) pointsLayer.removeChild(pointsLayer.firstChild);
      var curve = lock.thicknessCurve;
      curve.forEach(function(pt, idx){
        pointsLayer.appendChild(pointShapeMarkup(pt, pt===selectedPoint, idx===0 || idx===curve.length-1));
      });
    }

    // Dragging one end updates the single (dt,dv) offset shared by both sides (mirrored),

      var p = curve[idx];

      var limits = [];
      if(prev) limits.push((p.t - prev.t) * 0.9);
      if(next) limits.push((next.t - p.t) * 0.9);
      if(!limits.length) return 0.3;
      return Math.min.apply(null, limits);

    function redrawHandles(){
      while(handlesLayer.firstChild) handlesLayer.removeChild(handlesLayer.firstChild);
      if(!selectedPoint) return;
      var curve = lock.thicknessCurve;
      var idx = curve.indexOf(selectedPoint);
      if(idx < 0 || (selectedPoint.type||'spline') !== 'spline') return;
      var h = getPointHandle(curve, idx);
      var cx = gx(selectedPoint.t), cy = gy(selectedPoint.v);
      function addHandle(side, sign){
        var hx = gx(selectedPoint.t + sign*h.dt), hy = gy(selectedPoint.v + sign*h.dv);
        var ln = document.createElementNS(svgNS, 'line');
        ln.setAttribute('x1', cx); ln.setAttribute('y1', cy);
        ln.setAttribute('x2', hx); ln.setAttribute('y2', hy);
        ln.setAttribute('class', 'curve-handle-line');
        handlesLayer.appendChild(ln);
        var dot = document.createElementNS(svgNS, 'circle');
        dot.setAttribute('cx', hx); dot.setAttribute('cy', hy); dot.setAttribute('r', 4);
        dot.setAttribute('class', 'curve-handle-dot');
        dot.dataset.side = side;
        handlesLayer.appendChild(dot);

      if(idx > 0) addHandle('in', -1);
      if(idx < curve.length-1) addHandle('out', 1);

    function eventToGraphPx(e){
      var rect = svg.getBoundingClientRect();
      var scaleX = W/rect.width, scaleY = H/rect.height;
      return { px: (e.clientX-rect.left)*scaleX, py: (e.clientY-rect.top)*scaleY };
    }
    function findNearestPoint(px, py){
      var curve = lock.thicknessCurve;
      var best = null, bestD = Infinity;
      curve.forEach(function(pt){
        var dx = gx(pt.t)-px, dy = gy(pt.v)-py, d = dx*dx+dy*dy;
        if(d < bestD){ bestD = d; best = pt; }

    }
    function findNearestHandle(px, py){
      if(!selectedPoint) return null;
      var best = null, bestD = Infinity;
      Array.prototype.forEach.call(handlesLayer.querySelectorAll('.curve-handle-dot'), function(dot){
        var dx = parseFloat(dot.getAttribute('cx'))-px, dy = parseFloat(dot.getAttribute('cy'))-py;
        var d = dx*dx+dy*dy;
        if(d < bestD){ bestD = d; best = dot; }

      var handleHit = findNearestHandle(g.px, g.py);
      if(handleHit){
        pushUndoSnapshot();
        dragHandleSide = handleHit.side;
        svg.setPointerCapture(e.pointerId);
        return;
      }
      var found = findNearestPoint(g.px, g.py);
      pushUndoSnapshot();

      dragStartPx = g;
      if(found){
        dragPoint = found;
      } else {
        var newPt = { t: invX(g.px), v: invY(g.py), type: 'spline' };
        lock.thicknessCurve.push(newPt);

        var idx2 = curve2.indexOf(selectedPoint);
        var newT = invX(g2.px), newV = invY(g2.py);
        var dt, dv;
        if(dragHandleSide === 'out'){ dt = newT - selectedPoint.t; dv = newV - selectedPoint.v; }
        else { dt = selectedPoint.t - newT; dv = selectedPoint.v - newV; }

        selectedPoint.handleDt = Math.max(0.005, Math.min(cap, dt));
        selectedPoint.handleDv = Math.max(-2, Math.min(2, dv));
        regenerateLockGeometry(lock);
        redrawPath(); redrawHandles();
        return;

      if(!dragPoint) return;
      var g = eventToGraphPx(e);
      if(Math.abs(g.px-dragStartPx.px) + Math.abs(g.py-dragStartPx.py) > 3) dragMovedFar = true;

      var idx = curve.indexOf(dragPoint);
      var isEndpoint = (idx === 0 || idx === curve.length-1);
      dragPoint.v = invY(g.py);
      if(!isEndpoint){

        var maxT = curve[idx+1].t - 0.01;
        dragPoint.t = Math.min(maxT, Math.max(minT, invX(g.px)));

      redrawPath(); redrawPoints();

    });
    function updateSelectionClasses(){
      var curve = lock.thicknessCurve;
      Array.prototype.forEach.call(pointsLayer.children, function(el, idx){
        if(idx < curve.length) el.classList.toggle('selected', curve[idx] === selectedPoint);

    }

      if(dragHandleSide){ dragHandleSide = null; return; }
      if(dragPoint){ selectedPoint = dragPoint; updateSelectionClasses(); updateTypeRow(); redrawHandles(); }
